<style>
/* Layout: full-screen 3D hall, glass HUD pinned to the safe-area edges, one bottom sheet for every interaction */

}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:#140906;color:var(--ink);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent}

.standup{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);border-radius:999px;padding:8px 18px;font-size:14px;z-index:5}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;max-height:62%;display:flex;flex-direction:column;border-radius:20px 20px 0 0;
  background:var(--glass-strong);border-top:1px solid var(--gold-soft);box-shadow:0 -10px 40px rgba(0,0,0,.5);transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}

18|你問的這件事，背後自有原因。|眼看祿位與財馬都朝著你的前程而來。|若能得到貴人相助，便能多得利益，|雙方和合，結果分明。
19|富貴由命，是上天早已註定的。|心比天高、期望太大，反而耽誤時機。|不如回到原本的路上，|等雲開月出，自然見分明。
20|前途功名還不如意。|只怕命中有些糾葛交錯。|雙方都要防範損失，|勸你暫且退一步，不必嘆息。
21|佛法廣大，十方都有靈驗。|大災大難都能化解，不會臨到你身上。|就像紅日當空，永遠照耀，|還有貴人會來到你家相助。
22|姜太公到八十歲才成就家業。|月亮升起，光輝照遍四海。|命中自然會遇到大吉，|即使身在茅屋，也能百事亨通。
23|想去長江，江水卻廣闊茫茫，不知從何下手。|前途還沒有成功，運勢尚未通達。|如今釣竿雖然常拿在手上，|只怕魚與水還沒有相逢，機緣未到。
24|月亮升起，光輝照遍四海。|前途與祿位都能看見太平。|浮雲被掃開，終究平安無事，|可保災禍不會臨身。
25|前途的事不必太過費心勞神。|一再求神問聖也是白費。|等雞、犬（酉、戌）的日子過了，|不必刻意作福，事情自有分曉。
26|選出最好的那枝牡丹花。|勸你趕快摘取，不要遲疑。|世上如果問哪裡有知心之處，|萬事逢春，現在正是時候。
27|你只管寬心，自在過日子。|門庭清吉，家中沒有憂愁。|財寶自然會有好結果，|凡事沒有傷害，不必強求。
28|現在不要做這件事，還不是時候。|如同老虎落到平地被狗欺負，有志難伸。|世間的事本就難以確定，|千山萬水，前途仍多遲疑，宜靜待。
29|枯木可惜還沒有遇到春天。|現在反而藏在暗處，未能出頭。|寬心守著，等風霜退去，|還會讓你重新整頓乾坤、東山再起。
30|看著月亮漸漸圓滿。|過了之後要防範盛極而衰、難再往上。|若想改變作法、轉換方向往前走，|凡事必定要多費一番辛勞。
31|綠柳青青，正是好時節。|任你放手去做，開創新局。|花開結果，沒有凋零殘謝，|福祿自然會降臨家門。
32|龍虎在門前相鬥，彼此相爭。|這件事必定牽連雙方。|黃金忽然變成鐵，價值大減，|又何必再去作福問神仙。
33|想去長江，江水卻廣闊茫茫。|好在行船把穩方向，沒有遭遇風浪。|在家中用心修身、多做善事，|眼看魚水終能相逢，機緣將至。
34|危險的高山已經走完了，最難的考驗快要過去。|不要嫌這條路波折重重，此時更不能半途而廢。|只要看見蘭花與桂樹漸漸發芽開花，代表時機漸熟、好消息出現，|就像受困的長蛇能翻身變成飛龍，運勢大翻轉。
35|這件事何必再費盡心機。|前途的變化，到時自然會知道。|眼看此去能夠和合，|漸漸脫離困境，見到太平。
36|福如東海，壽比南山。|你又何必感嘆苦難。|命中自然會遇到大吉，|祈求保佑，自能平安。
37|運勢正好，得意之時身分也有所改變。|這對你自身各方面都有益處。|一路往前沒有難事，|下定決心去做，可保清吉。
38|名聲顯揚，心願就在眼前。|不必刻意祈禱，心自然安定。|看看早晚過些日子，|立刻就能稱心如意。
39|心中想問神仙指路，|勸你暫且退一步，登高遠望。|寬心守候、寬心安坐，|必然會遇到貴人扶持。
40|平生的富貴與祿位都能成就。|你家的門戶必定光彩輝煌。|這件事必定沒有損失，|夫妻百年好合，歡喜相隨。
41|事情走到這一步，實在難以推辭。|唱歌喝酒，自在徘徊，心意未定。|雞犬之聲相聞，消息已經近了，|婚姻是前世註定，終能結成一對。
42|一重江水又一重山，阻礙一層接一層。|誰知道這一去，路又更難走。|任他怎麼改求也過不去，|是非糾纏，終究難以安寧。
43|一年來做事急如飛，心中著急。|勸你寬心，不要遲疑不決。|貴人還在千里之外，|消息會在月中漸漸傳來。
44|客人前來，前途多有收穫。|你又何必彼此猜疑。|雖然中間會有進有退，|等到月出光輝，就是得運之時。
45|花已開過，現在已經結成果實。|富貴榮華能夠一直到老。|君子與小人都能和睦相處，|萬事清吉，不必煩惱。
46|功名得意，在你身上顯揚。|前途富貴，歡喜又安然。|若遇到一輪明月高照，|十五月圓，光輝滿天，圓滿之時。
47|你何必再去求問神蹟。|你自己心中其實已經明白，對你有益。|現在先看月中旬的時候，|壞事會脫身，化為吉利。
48|在人間做事，與人意見不合。|雲遮住了月光，一片朦朧不明。|心裡雖然想往前走，|只怕命中時運還沒有通達。
49|旁人的話雖多，卻不可盲目聽從。|風雲還在靜處，龍還沒有飛騰，時機未到。|暗中終究會得到明確的消息，|你又何必一問再問。
50|在神佛面前發誓，心意堅定不變。|看看前途會有好消息傳來。|這東西原本只是鐵，|也能變化成黃金，轉劣為優。
51|東西南北都不好走，四處受阻。|但眼前這件事正可以承擔。|勸你把定心意，不要煩惱，|家門自然能夠保持安康。
52|功名事業本來就由上天安排。|不必一直牽掛，心懸意亂。|若要問什麼時候會有結果，|風雲際會，就在眼前。
53|看你來問心中所想的事。|積善之家，必有餘慶。|運勢亨通，財與子雙雙到來，|不久之後，喜氣便會充滿家門。
54|孤燈寂寂，夜色沉沉，暫時孤單無助。|但萬事終究清吉，萬事可成。|若能在暗中種下善因、結出善果，|燒一炷好香，誠心便能上達神明。
55|要知道進退之間，多半只是虛話。|看看暗中發展，未必能完全如意。|珍珠美玉深藏，還沒有顯露變化，|心中雖有所得，恐怕也是枉然。
56|生病時若受苦勞心，|到最後也還是難以完全周全。|事情過去了就不必回頭再問，|心中的事務終會漸漸消磨淡去。
57|勸你把定心意，不要虛浮。|前途清吉，正是得運之時。|到頭來中間不會有大事，|又有神仙守護，安居樂業。
58|蛇想要變成龍，盼望翻身。|只怕命中時運還沒有通達。|久病的人暫且寬心安坐，|旁人的話雖多，卻不可盲目聽從。

function cvs(w,h,draw){ const c=document.createElement("canvas"); c.width=w;c.height=h; const x=c.getContext("2d"); draw(x,w,h); const t=new T.CanvasTexture(c); t.encoding=T.sRGBEncoding; t.anisotropy=4; t._draw=draw; t._ctx=x; return t; }

const SUN=new T.Vector3(1,.11,-.22).normalize();
const skyMat=new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,uniforms:{sun:{value:SUN},time:{value:0},night:{value:0},day:{value:0}},
  vertexShader:`varying vec3 vD; void main(){ vD=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader:`varying vec3 vD; uniform vec3 sun; uniform float time; uniform float night; uniform float day;
  float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
  float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),f.x),mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),f.x),f.y); }
  float fbm(vec2 p){ float v=0.0, a=0.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.03+vec2(1.7,9.2); a*=0.5; } return v; }
  void main(){
    vec3 d=normalize(vD); float h=d.y; float s=max(dot(d,sun),0.0);
    vec3 c=mix(vec3(1.0,.60,.26),vec3(.98,.40,.30),smoothstep(.0,.07,h));
    c=mix(c,vec3(.64,.27,.44),smoothstep(.05,.2,h));
    c=mix(c,vec3(.24,.16,.40),smoothstep(.18,.45,h));
    c=mix(c,vec3(.07,.08,.22),smoothstep(.45,.95,h));
    c+=vec3(1.0,.5,.18)*pow(s,5.0)*.6*(1.0-smoothstep(.0,.5,h));
    c+=vec3(1.0,.78,.45)*pow(s,40.0)*.7;
    if(h>0.0){
      vec2 uv=d.xz/(h+.12);
      float n=fbm(uv*vec2(.55,1.6)+vec2(time*.004,0.0));
      float n2=fbm(uv*vec2(1.3,3.2)-vec2(time*.006,0.0)+5.0);
      float band=smoothstep(.015,.07,h)*(1.0-smoothstep(.3,.62,h));
      float cov=smoothstep(.47,.72,n*.75+n2*.35)*band;
      float glow=pow(s,2.0);
      vec3 under=vec3(.44,.18,.33);
      vec3 lit=mix(vec3(.98,.42,.52),vec3(1.0,.74,.36),glow);
      vec3 cc=mix(under,lit,smoothstep(.35,.85,n2+glow*.45));
      cc*=1.0+glow*1.1;
      c=mix(c,cc,cov*.92);
      c+=vec3(1.0,.7,.4)*cov*(1.0-cov)*glow*1.4;
    }
    float disc=smoothstep(.99955,.99978,s);
    c=mix(c,vec3(1.0,.92,.72)*1.6,disc);
    float az=atan(d.z,d.x); vec2 ring=vec2(cos(az),sin(az));
    float m1=.03+.032*fbm(ring*2.4+3.1)+.008*sin(az*9.0);
    float m2=.012+.03*fbm(ring*4.3+7.7);
    if(h<m1){ c=mix(c,mix(vec3(.52,.25,.34),c,.3),.88); }
    if(h<m2){ c=vec3(.17,.08,.1)+vec3(.14,.06,.03)*pow(s,3.0); }
    if(h<0.0){ c=vec3(.11,.055,.05); }
    vec3 dc=mix(vec3(.62,.78,.95),vec3(.22,.45,.86),clamp(h*2.2,0.,1.)); if(h<m1) dc=vec3(.30,.40,.36); if(h<m2) dc=vec3(.20,.28,.24); if(h<0.0) dc=vec3(.16,.2,.17);
    dc=mix(dc,vec3(1.,.98,.9)*1.4,smoothstep(.9994,.9998,s)*step(0.,h)); c=mix(c,dc,day);
    c=mix(c,c*vec3(.16,.17,.32)+vec3(.006,.008,.03),night);
    vec3 sd=floor(normalize(vD)*260.); float st=fract(sin(dot(sd,vec3(12.9898,78.233,37.719)))*43758.5453); c+=vec3(.9,.92,1.)*step(.9975,st)*night*step(m1,h)*(.6+.4*sin(time*2.+st*40.));
    gl_FragColor=vec4(c,1.0); }`});

  for(let i=0;i<N;i++){ const a=base+i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }

// Both live only on each player's phone: nothing here is sent to the server, so they cost no server traffic.

const FAKE_CROWD=true;
function fakeRand(i){ let h=(i*2654435761)>>>0; h^=h>>>15; h=Math.imul(h,2246822519)>>>0; h^=h>>>13; return (h>>>0)/4294967296; }

{ let x0=0,y0=0; const scroller=el=>{ for(let n=el;n&&n!==document.body;n=n.parentElement){ if(n.nodeType!==1) continue; const cs=getComputedStyle(n); if((cs.overflowY==="auto"||cs.overflowY==="scroll")&&n.scrollHeight>n.clientHeight+1) return n; } return null; };
  document.addEventListener("touchstart",e=>{ if(e.touches.length){ x0=e.touches[0].clientX; y0=e.touches[0].clientY; } },{passive:true});
  document.addEventListener("touchmove",e=>{ if(e.touches.length>1) return; const t=e.touches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(e.target===canvas){ e.preventDefault(); return; }

const CODE_ITEMS=["xiang","hua","guo","bing","jin","fu"];
function lookCode(){ const bits=[]; const put=(v,n)=>{ v=Math.max(0,Math.min((2**n)-1,v|0)); for(let i=n-1;i>=0;i--) bits.push((v/2**i|0)&1); };
  put(1,4); for(let i=0;i<13;i++) put(me.look[i]||0,5); put(bag.coins,16); CODE_ITEMS.forEach(k=>put(bag.items[k]||0,5)); put(bag.redThread?1:0,1);
  const ps=(bag.poems||[]).slice(-5); put(ps.length,3); ps.forEach(n=>put(n,6)); put(me.no||0,24);
  const nm=[...String(me.sp?"":(me.name||""))].slice(0,10).join(""); const cu=[]; for(let i=0;i<nm.length;i++) cu.push(nm.charCodeAt(i)); put(Math.min(15,cu.length),4); cu.slice(0,15).forEach(c=>put(c,16));
  while(bits.length%8) bits.push(0); const bytes=[]; for(let i=0;i<bits.length;i+=8){ let b=0; for(let j=0;j<8;j++) b=b*2+bits[i+j]; bytes.push(b); } bytes.push(bytes.reduce((a,b)=>(a+b)&255,0x5a));
  return "MZ-"+btoa(String.fromCharCode(...bytes)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function readCode(str){ try{ str=String(str||"").trim().replace(/\s+/g,""); if(!/^MZ-[A-Za-z0-9_-]{10,}$/.test(str)) return null; const raw=atob(str.slice(3).replace(/-/g,"+").replace(/_/g,"/")); const bytes=[...raw].map(c=>c.charCodeAt(0));
  const chk=bytes.pop(); if(bytes.reduce((a,b)=>(a+b)&255,0x5a)!==chk) return null; const bits=[]; bytes.forEach(b=>{ for(let i=7;i>=0;i--) bits.push((b>>i)&1); }); let p=0; const get=n=>{ let v=0; for(let i=0;i<n;i++) v=v*2+(bits[p++]||0); return v; };
  if(get(4)!==1) return null; const look=[]; for(let i=0;i<13;i++) look.push(get(5)); const coins=get(16); const items={}; CODE_ITEMS.forEach(k=>{ const v=get(5); if(v) items[k]=v; }); const red=get(1);
  const pn=get(3), poems=[]; for(let i=0;i<pn;i++){ const n=get(6); if(n>=1&&n<=60) poems.push(n); } const no=get(24); const nl=get(4); let name=""; for(let i=0;i<nl;i++) name+=String.fromCharCode(get(16));
  return {look,coins,items,red,poems,no,name}; }catch(e){ return null; } }

// homophone matching: every character becomes the set of its readings (tones dropped, zh/z ch/c sh/s ng/n merged)
let PYIDX=null; const pyCache=new Map();
function syl(x){ return x.toLowerCase().replace(/[^a-zü]/g,"").replace(/ü/g,"v").replace(/^zh/,"z").replace(/^ch/,"c").replace(/^sh/,"s").replace(/ng$/,"n"); }
function charPys(ch){ if(pyCache.has(ch)) return pyCache.get(ch); let set=null;
  if(/\p{Script=Han}/u.test(ch)&&window.pinyinPro){ try{ const r=pinyinPro.pinyin(ch,{toneType:"none",multiple:true,type:"array"}); set=new Set(r.map(syl).filter(Boolean)); }catch(e){} }
  pyCache.set(ch,set); return set; }
function buildPy(){ if(PYIDX||!window.pinyinPro) return PYIDX; PYIDX=FUZZY.map(w=>{ const chars=Array.from(w).map(charPys); const flat=pinyinPro.pinyin(w,{toneType:"none",type:"array"}).map(syl).join(""); return {chars,flat}; }); return PYIDX; }
function fuzzyPolitics(t){ const idx=buildPy(); if(!idx) return false; const tc=Array.from(t).map(charPys); const latin=t.replace(/[^a-z]/g,"");
  for(const k of idx){ const n=k.chars.length; if(k.chars.some(c=>!c)) continue;
    for(let i=0;i+n<=tc.length;i++){ let ok=true; for(let j=0;j<n;j++){ const a=tc[i+j]; if(!a){ ok=false; break; } let hit=false; for(const v of a) if(k.chars[j].has(v)){ hit=true; break; } if(!hit){ ok=false; break; } } if(ok) return true; }
    if(k.flat.length>=6&&latin.length>=6&&syl("x"+latin).slice(1)&&latin.replace(/zh/g,"z").replace(/ch/g,"c").replace(/sh/g,"s").replace(/ng/g,"n").includes(k.flat.replace(/ng/g,"n"))) return true; }
  return false; }
// 加賴 / +賴 (and 加line / +line) is never allowed anywhere you can type, spaces and symbols in between included
function hasAddLine(raw){ const t=String(raw||"").normalize("NFKC").toLowerCase().replace(/[\s._\-~*·・、，,。]/g,""); return /(加|\+|十|＋)(賴|赖|line|ㄌㄞ)/.test(t); }
function chatCheck(raw){ const nf=String(raw||"").normalize("NFKC"); const lower=nf.toLowerCase();
  if(hasAddLine(nf)) return "line";
  if(/(https?:|www\.|\.com|\.net|\.org|\.tw\b|\.cc\b|\.io\b|\.me\b|\.ly\b|t\.me|@)/.test(lower)) return "ads";
  if((nf.match(/\d/g)||[]).length>=6) return "phone";
  let t=lower.replace(/[\s\p{P}\p{S}_]/gu,"");
  if(CN_DIGITS.test(t)) return "phone";
  for(const a of ALLOW) t=t.split(a).join("");
  for(const k of ["politics","profanity","ads"]) for(const w of BLOCK[k]) if(t.includes(w.toLowerCase())) return k;
  if(fuzzyPolitics(t)) return "politics";
  return null; }

// 洗頻: the same sentence twice in a row is refused (no limit on how many different lines, so quick talkers aren't muted)
const FLOOD={last:"",times:[],muteUntil:0};
const floodKey=t=>String(t||"").normalize("NFKC").toLowerCase().replace(/[\s\p{P}\p{S}]/gu,"");
function floodCheck(text){ if(floodKey(text)&&floodKey(text)===FLOOD.last) return "同一句話不能連續發送"; return null; }
function floodNote(text){ FLOOD.last=floodKey(text); FLOOD.times.push(Date.now()); }
// the same rules applied to what other players send, so a modified page can't flood everyone else's screen
function peerFlood(av,text){ const k=floodKey(text); av.fl=av.fl||{last:""}; if(k&&k===av.fl.last) return true; av.fl.last=k; return false; }
function sendChat(text){ text=cleanChat(text); if(!text) return false; const now=performance.now(); if(now-lastChatAt<800) return false; /* only stops an accidental double tap */
  const bad=chatCheck(text); if(bad){ toast(`沒有送出：${CHAT_REASON[bad]}`,2800); return false; }
  const fl=floodCheck(text); if(fl){ toast(fl,2800); return false; } floodNote(text);

// Only halls with people (plus yours) are listed; the next empty hall appears once every listed hall is nearly full, so players gather instead of spreading out.
function renderHalls(){ const c=HALLS.counts||[]; const cur=HALLS.current(); const list=[];
  const ts=Date.now(); HALL_NAMES.forEach((_,i)=>{ if(hallShown(i,ts)>0||i===cur) list.push(i); });
  if(list.every(i=>(c[i]||0)>=HALL_CAP*.8)){ const nx=HALL_NAMES.findIndex((_,i)=>!list.includes(i)); if(nx>=0) list.push(nx); }
  list.sort((a,b)=>a-b);
  const rows=list.map(i=>{ const nm=HALL_NAMES[i]; const n=hallShown(i,ts), me_=i===cur; const full=(c[i]||0)>=HALL_CAP&&!me_; const capShown=Math.max(HALL_CAP,100); const pct=Math.min(100,n/capShown*100);
    return `<button class="hall-row" data-act="hallGo" data-v="${i}" aria-current="${me_}" ${full?"disabled":""}><span class="hn">${nm}</span><span class="bar"><i style="width:${pct}%"></i></span><span class="hc">${n}/${capShown} 人</span><span class="hc">${me_?"目前":full?"已滿":"前往"}</span></button>`; }).join("");
  const el=$("#hallList"); if(el) el.innerHTML=`<p class="note">全廟目前 ${shownTotal()} 人</p>`+rows; }
function localHalls(){ if(HALLS.switchTo) return; let hall=0; HALLS.current=()=>hall;

function playZhan(){ const L=gameLayer("斬小人","手指劃過草人，10 秒內斬越多下越好"); const {x}=L; let cuts=0, started=0, end=false, shake=0, slashes=[], bits=[], trail=[]; const LIM=10;
  // The straw man picture; cuts are painted onto a copy of it (only where there is straw), so the marks stay on the figure.
  const img=new Image(), F=document.createElement("canvas"), fx=F.getContext("2d"); let mask=null, MW=0, MH=0;
  img.onload=()=>{ F.width=img.naturalWidth; F.height=img.naturalHeight; fx.drawImage(img,0,0);
    MW=100; MH=Math.round(100*img.naturalHeight/img.naturalWidth); const m=document.createElement("canvas"); m.width=MW; m.height=MH; const mx=m.getContext("2d"); mx.drawImage(img,0,0,MW,MH);
    const d=mx.getImageData(0,0,MW,MH).data, raw=new Uint8Array(MW*MH); for(let i=0;i<MW*MH;i++) raw[i]=d[i*4+3]>60?1:0;
    mask=new Uint8Array(MW*MH); for(let yy=0;yy<MH;yy++) for(let xx=0;xx<MW;xx++){ let v=0; for(let dy=-1;dy<=1&&!v;dy++) for(let dx=-1;dx<=1;dx++){ const X=xx+dx, Y=yy+dy; if(X>=0&&Y>=0&&X<MW&&Y<MH&&raw[Y*MW+X]){ v=1; break; } } mask[yy*MW+xx]=v; } };
  img.src=XIAOREN_IMG;
  const box=()=>{ const W=L.W(), H=L.H(), ar=F.width&&F.height?F.width/F.height:.766, h=Math.min(H*.6,W*.8/ar), w=h*ar; return {cx:W/2,cy:H*.57,w,h}; };
  const inFig=(px,py)=>{ if(!mask) return false; const b=box(), u=(px-(b.cx-b.w/2))/b.w, v=(py-(b.cy-b.h/2))/b.h; if(u<0||v<0||u>=1||v>=1) return false; return !!mask[Math.floor(v*MH)*MW+Math.floor(u*MW)]; };
  const scar=(x0,y0,x1,y1)=>{ if(!F.width) return; const b=box(), k=F.width/b.w, X=v=>(v-(b.cx-b.w/2))*k, Y=v=>(v-(b.cy-b.h/2))*k;
    const ax=X(x0), ay=Y(y0), bx=X(x1), by=Y(y1); fx.save(); fx.globalCompositeOperation="source-atop"; fx.lineCap="round";
    fx.strokeStyle="rgba(60,25,8,.9)"; fx.lineWidth=F.width*.022; fx.beginPath(); fx.moveTo(ax,ay); fx.lineTo(bx,by); fx.stroke();
    fx.strokeStyle="rgba(255,236,170,.95)"; fx.lineWidth=F.width*.007; fx.beginPath(); fx.moveTo(ax,ay-F.width*.006); fx.lineTo(bx,by-F.width*.006); fx.stroke(); fx.restore(); };
  const swish=()=>{ noiseBurst(.12,.22,2600); tone(180,.12,.06,"sawtooth"); };
  const draw=()=>{ if(L.done) return; const W=L.W(), H=L.H(), now=performance.now(); const left=started?Math.max(0,LIM-(now-started)/1000):LIM;
    x.fillStyle="#1d0f0a"; x.fillRect(0,0,W,H); const g=x.createRadialGradient(W/2,H*.57,10,W/2,H*.57,Math.max(W,H)*.7); g.addColorStop(0,"rgba(180,40,20,.35)"); g.addColorStop(1,"rgba(0,0,0,0)"); x.fillStyle=g; x.fillRect(0,0,W,H);
    const b=box(); x.save(); x.translate(b.cx+(shake>0?(Math.random()-.5)*shake:0),b.cy); shake*=.85; x.rotate(Math.sin(now/300)*.02);

function fwProgram(seed){ const r=fwRng(seed), ev=[]; const pick=a=>a[(r()*a.length)|0];
  const backZ=()=>HZ+YX+30+r()*14;
  const shell=(t,type,o={})=>{ const big=!!o.big; const x=o.x??(r()-.5)*40, z=o.z??backZ(); const y=o.y??(big?34+r()*10:16+r()*12); ev.push({t,kind:"shell",type,x,y,z,big,s:o.s??(big?15+r()*4:9+r()*4),n:o.n??(big?460:220),c:o.c??pick(FWC),ci:(r()*8)|0,fl:o.fl??(1.1+y/24)}); };
  // symmetric pair: same shell mirrored left/right at the same moment
  const pair=(t,type,o={})=>{ const x=o.x??(6+r()*16), y=o.y??(o.big?34+r()*8:16+r()*10), z=o.z??backZ(), c=o.c??pick(FWC); shell(t,type,{...o,x,y,z,c}); shell(t,type,{...o,x:-x,y,z,c}); };
  const gerb=(t,x,dur,c)=>ev.push({t,kind:"gerb",x,z:HZ+YX+22.9,y:3.9,dur,c:c||pick(FWC)[0]});
  const mine=(t,x,c)=>ev.push({t,kind:"mine",x,z:HZ+YX+22.3,c:c||pick(FWC)});
  // fan cake: every tube fires at once in a symmetric fan
  const fan=(t,x,shots,c)=>{ const pal=c||pick(FWC); for(let k=0;k<shots;k++){ const ang=(k/(shots-1)*2-1)*1.05; const h=9+r()*2; ev.push({t,kind:"comet",sx:x,sy:3.9,sz:HZ+YX+22.9,ex:x+Math.sin(ang)*h,ey:3.9+Math.cos(ang)*h,ez:HZ+YX+23.5,c:[pal[k%2],pal[(k+1)%2]]}); } };
  const fans=(t,c)=>{ const pal=c||pick(FWC); for(const x of [-12,0,12]) fan(t,x,11,pal); };
  const types=["peony","chrys","willow","glitter","ring","palm","crossette","crackle","dring","multi","rainbow","twotone","meteor"];
  // 0–20s opening: centre shell, then mirrored pairs
  shell(.8,"rainbow",{x:0,big:true});
  for(let t=2.5;t<20;t+=1.0+r()*.5){ if(r()<.6) pair(t,pick(["peony","chrys","ring","rainbow","twotone"])); else shell(t,pick(["peony","rainbow"]),{x:0}); }
  // 20–60s: wall-top fountains, fan cakes, mixed shells
  for(const x of [-12,-6,6,12]) gerb(20,x,14); for(const x of [-9,0,9]) gerb(40,x,12);
  for(let t=20;t<60;t+=.6+r()*.4){ if(r()<.5) pair(t,pick(types)); else shell(t,pick(types)); if(r()<.3) pair(t+.3,pick(["peony","glitter"]),{y:7+r()*4,z:HZ+YX+26+r()*6,s:5+r()*2,n:120}); }
  for(let t=24;t<58;t+=4+r()*2){ mine(t,-10); mine(t,10); }
  for(let t=26;t<60;t+=6+r()*2) fans(t);
  // 60–100s: shapes, willows, and full-sky 彩千輪
  for(let t=60;t<100;t+=.9+r()*.4){ const ty=pick(["heart","star","willow","dring","ring","palm","heart"]); if(r()<.5) pair(t,ty); else shell(t,ty,{x:0}); if(r()<.3) shell(t+.5,"crackle",{y:10+r()*5}); }
  for(let t=64;t<100;t+=8+r()*3){ shell(t,"senrin",{x:0,big:true,y:32,s:14}); pair(t+.15,"senrin",{x:16,y:26,s:11}); }
  const D=36; // extra 36 seconds: 100–136s — 千輪, fan cakes and mixed pairs
  for(let t=100;t<136;t+=.8+r()*.4){ if(r()<.6) pair(t,pick(types)); else shell(t,pick(["rainbow","twotone","meteor","peony"]),{x:0}); }
  for(let t=102;t<136;t+=7+r()*2){ shell(t,"senrin",{x:0,big:true,y:34,s:15}); pair(t+.2,"senrin",{x:17,y:27,s:12}); }
  for(let t=104;t<136;t+=5+r()*2) fans(t); for(const x of [-12,-4,4,12]) gerb(110,x,16);
  // 136–176s: high big shells over everything, mirrored
  for(let t=100+D;t<140+D;t+=1.0+r()*.5){ pair(t,pick(["chrys","peony","willow","glitter","crossette","rainbow","willow","meteor"]),{big:true}); if(r()<.5) shell(t+.5,pick(types),{x:0}); }
  for(let t=106+D;t<140+D;t+=9+r()*3){ shell(t,"senrin",{x:0,big:true,y:36,s:16}); pair(t+.2,"senrin",{x:18,big:true,y:30,s:13}); }
  for(const x of [-14,-7,0,7,14]) gerb(118+D,x,10);
  // 140–165s: low show — fans, mines and low shells
  for(let t=140+D;t<165+D;t+=.45+r()*.3){ if(r()<.4){ mine(t,-8-r()*6); mine(t,8+r()*6); } else pair(t,pick(["peony","glitter","crackle","ring","rainbow"]),{y:7+r()*5,z:HZ+YX+25+r()*8,s:5+r()*3,n:140}); }
  for(let t=141+D;t<165+D;t+=3.5+r()*1.5) fans(t);
  for(const x of [-12,-4,4,12]) gerb(142+D,x,20);
  // 165–180s: finale barrage, high and low together, ending in a sky-wide 千輪
  for(let t=165+D;t<177+D;t+=.12+r()*.12){ if(r()<.5) pair(t,pick(["peony","chrys","glitter","crackle","willow","multi","rainbow","twotone"]),{big:r()<.45}); else shell(t,pick(types),{x:(r()-.5)*10}); }
  fans(166+D); fans(170+D); fans(174+D);
  shell(177.4+D,"senrin",{x:0,big:true,y:34,s:18}); pair(177.5+D,"senrin",{x:20,big:true,y:30,s:15});
  shell(178.6+D,"willow",{big:true,x:0,n:700,s:20}); pair(178.8+D,"glitter",{big:true,x:15,n:420});
  shell(FW_LEN-1.5,"mazu",{x:0,y:30,z:HZ+YX+36,big:true,fl:2.2});
  ev.sort((a,b)=>a.t-b.t); return ev; }

const hemiLight=scene.children.find(o=>o.isHemisphereLight); const fogDusk=scene.fog.color.clone();
function todPhase(){ const p=(Date.now()/1000%1200)/1200; // 0–.3 dusk … .3→.45 nightfall … .45–.85 night … .85→1 back to dusk
  const sm=(a,b,v)=>{ const t=Math.max(0,Math.min(1,(v-a)/(b-a))); return t*t*(3-2*t); };
  const night=sm(.3,.45,p)-sm(.85,1,p); return {night,day:0}; } // dusk ↔ night only
const _dn={night:0,day:0};
function dayNight(dt){ const want=FW.on?{night:0,day:0}:todPhase(); const k=_dn.init?Math.min(1,dt*.5):1; _dn.init=1; _dn.night+=(want.night-_dn.night)*k; _dn.day+=(want.day-_dn.day)*k;
  skyMat.uniforms.night.value=_dn.night; skyMat.uniforms.day.value=_dn.day;
  sunLight.intensity=.75*(1-_dn.night)+.5*_dn.day; sunLight.color.setRGB(1,.6+.38*_dn.day,.32+.6*_dn.day);
  if(hemiLight){ hemiLight.intensity=.32+.5*_dn.day-.14*_dn.night; hemiLight.color.setRGB(.48+.4*_dn.day-.2*_dn.night,.33+.5*_dn.day-.1*_dn.night,.27+.6*_dn.day+.1*_dn.night); }
  scene.fog.color.copy(fogDusk).lerp(_c1.setRGB(.55,.66,.75),_dn.day).lerp(_c1.setRGB(.03,.03,.07),_dn.night);
  lanternMat.emissiveIntensity=.55+.3*_dn.night-.25*_dn.day; }

function fwStart(seed,elapsedMs){ const el=Math.max(0,(elapsedMs||0)/1000); if(el>FW_LEN||seed===FW.seed) return; seenOnce("f"+seed); /* someone who reloads mid-show picks it up where it is now (already-launched shells are skipped, see fwUpdate) */ FW.seed=seed; sparkDismissed=false; FW.ev=fwProgram(seed); FW.i=0; FW.t0=performance.now()-el*1000; FW.on=true; FW.endAt=FW.t0+(FW_LEN+2)*1000; trackPos.fw=el; FW.rockets.length=0; FW.gerbs.length=0;
  while(FW.i<FW.ev.length&&FW.ev[FW.i].t<el-.2) FW.i++;
  showCaption("全服煙火秀開始！"); toast("主委施放全服煙火！到廟外廣場看，還可以拿仙女棒",4500); renderSparkBtn(); }
function fwUpdate(dt){ const now=performance.now();
  if(FW.on){ const t=(now-FW.t0)/1000;
    while(FW.i<FW.ev.length&&FW.ev[FW.i].t<=t){ const e=FW.ev[FW.i++]; if(t-e.t>1.5) continue;
      if(e.kind==="shell"){ const lx=e.x*.6, lz=e.z; FW.rockets.push({e,x:lx,y:1,z:lz,t:0,fl:e.fl});  }
      if(e.kind==="gerb") FW.gerbs.push({...e,t:0});

function ftHash(s){ let h=2166136261; for(const ch of s){ h^=ch.codePointAt(0); h=Math.imul(h,16777619)>>>0; } return h; }
function ftPick(arr,seed,salt){ return arr[ftHash(seed+"|"+salt)%arr.length]; }
function ftTenGod(dayGan,otherGan){ const a=FT_GAN_EL[dayGan], b=FT_GAN_EL[otherGan], same=(FT_GAN.indexOf(dayGan)%2)===(FT_GAN.indexOf(otherGan)%2);
  if(a===b) return same?"比肩":"劫財"; if(FT_GEN[a]===b) return same?"食神":"傷官"; if(FT_CTRL[a]===b) return same?"偏財":"正財"; if(FT_CTRL[b]===a) return same?"七殺":"正官"; return same?"偏印":"正印"; }
const FT_CAT={比肩:"比劫",劫財:"比劫",食神:"食傷",傷官:"食傷",偏財:"財",正財:"財",七殺:"官",正官:"官",偏印:"印",正印:"印"};
function ftTaiSui(a,b){ // a: the person's year branch, b: this year's branch
  if(a===b) return "值"; const d=(FT_ZHI.indexOf(a)-FT_ZHI.indexOf(b)+12)%12; if(d===6) return "沖";
  const pair=(x,y)=>[x+y,y+x].includes(a+b);
  if([["子","丑"],["寅","亥"],["卯","戌"],["辰","酉"],["巳","申"],["午","未"]].some(p=>pair(...p))) return "合";
  if([["子","未"],["丑","午"],["寅","巳"],["卯","辰"],["申","亥"],["酉","戌"]].some(p=>pair(...p))) return "害";
  if([["子","酉"],["卯","午"],["辰","丑"],["未","戌"],["寅","亥"],["巳","申"]].some(p=>pair(...p))) return "破";
  if(pair("子","卯")||["寅巳","巳申","申寅","丑戌","戌未","未丑"].some(s=>pair(s[0],s[1]))) return "刑";
  return "無"; }

function ftToday(r,now){ const dt=now||new Date(), ds=dt.getFullYear()+"-"+(dt.getMonth()+1)+"-"+dt.getDate();
  const dp=Solar.fromYmdHms(dt.getFullYear(),dt.getMonth()+1,dt.getDate(),12,0,0).getLunar().getDayInGanZhi(); const g=dp[0], z=dp[1], el=FT_GAN_EL[g];
  const cat=FT_CAT[ftTenGod(r.day,g)], rel=ftTaiSui(r.pillars[2][1],z), seed=r.seed+ds, j=k=>(ftHash(seed+k)%3)-1;
  const base=3+(el===r.fav?1:0)+(el===r.avoid?-1:0)+(rel==="沖"?-1:rel==="合"?1:0);
  const star=v=>Math.max(1,Math.min(5,Math.round(v)));
  const all=star(base+j("a")*.5), money=star(base+(cat==="財"?1:0)+j("m")), love=star(base+(cat==="食傷"||rel==="合"?1:0)+j("l")), work=star(base+(cat==="官"||cat==="印"?1:0)+j("w"));
  let text=ftPick(FT_DAY[cat],seed,"t"); if(rel==="沖") text+="另外今天跟你有點沖，出門注意安全、開車慢一點。"; else if(rel==="合") text+="今天跟你特別合，想做的事就去做吧！";
  const pool=[...FT_YI[cat],...FT_YI.any], yi=[], ji=[]; for(let i=0;yi.length<2&&i<20;i++){ const x=pool[ftHash(seed+"y"+i)%pool.length]; if(!yi.includes(x)) yi.push(x); }
  for(let i=0;ji.length<2&&i<20;i++){ const x=FT_JI[ftHash(seed+"j"+i)%FT_JI.length]; if(!ji.includes(x)) ji.push(x); }
  const lel=(el===r.fav||FT_GEN[el]===r.fav)?el:r.fav, cols=FT_LUCK[lel].color.split("、");
  return {all,money,love,work,text,yi,ji,color:cols[ftHash(seed+"c")%cols.length],num:(ftHash(seed+"n")%9)+1,dir:FT_LUCK[lel].dir,date:(dt.getMonth()+1)+"/"+dt.getDate()}; }
function ftReading(y,m,d,hourIdx,now){ const H=hourIdx>=0?FT_HOURS[hourIdx][2]:12;
  const ec=Solar.fromYmdHms(y,m,d,H,0,0).getLunar().getEightChar();
  const P=[ec.getYear(),ec.getMonth(),ec.getDay(),hourIdx>=0?ec.getTime():null]; const day=P[2][0], me=FT_GAN_EL[day];
  // five elements: each stem 1, each branch's main element 1, its other hidden stems .3; the month branch counts 1.5 for strength
  const cnt={木:0,火:0,土:0,金:0,水:0}; let sup=0, tot=0;
  P.forEach((p,i)=>{ if(!p) return; const g=p[0], z=p[1];
    const add=(el,w,isDay)=>{ cnt[el]+=w; if(isDay) return; const k=i===1&&w>=1?1.5:1; tot+=w*k; if(el===me||FT_GEN[el]===me) sup+=w*k; };
    add(FT_GAN_EL[g],1,i===2); add(FT_ZHI_EL[z],1,false); FT_HIDE[z].slice(1).forEach(h=>add(FT_GAN_EL[h],.3,false)); });
  const strong=sup/tot>=.45;
  const order=FT_EL.slice().sort((a,b)=>cnt[a]-cnt[b]); const least=order[0], most=order[4];
  // favourable element: a strong chart wants an outlet (what it produces, controls, or is controlled by), a weak one wants support
  const cand=strong?[FT_GEN[me],FT_CTRL[me],FT_EL.find(e=>FT_CTRL[e]===me)]:[FT_EL.find(e=>FT_GEN[e]===me),me];
  const fav=cand.slice().sort((a,b)=>cnt[a]-cnt[b])[0], avoid=FT_EL.find(e=>FT_CTRL[e]===fav);
  // dominant kind of 十神 among the other stems and the branches' main stems
  const cats={財:0,官:0,印:0,食傷:0,比劫:0};
  P.forEach((p,i)=>{ if(!p) return; if(i!==2) cats[FT_CAT[ftTenGod(day,p[0])]]+=1; cats[FT_CAT[ftTenGod(day,FT_HIDE[p[1]][0])]]+=.8; });
  const cat=Object.keys(cats).sort((a,b)=>cats[b]-cats[a]||a.localeCompare(b))[0];
  // this year's pillar (the year turns at 立春, like the birth year)
  const nowL=Solar.fromDate(now||new Date()).getLunar(), yp=nowL.getEightChar().getYear(), yCat=FT_CAT[ftTenGod(day,yp[0])];
  const ts=ftTaiSui(P[0][1],yp[1]); const seed=P.map(p=>p||"--").join("");
  const goodMonths=Object.keys(FT_MONTH_EL).filter(k=>FT_MONTH_EL[k]===fav).map(Number), badMonths=Object.keys(FT_MONTH_EL).filter(k=>FT_MONTH_EL[k]===avoid).map(Number);
  const T=FT_TXT, C=T.cat[cat];
  const verdict=ftHash(seed+"v")%2?ftPick(T.verdict[cat],seed,"vc"):ftPick(T.verdict.any,seed,"va");
  return { seed, pillars:P, day, me, animal:FT_ANIMAL[P[0][1]], strong, cnt, least, most, fav, avoid, cat, year:yp, yearAnimal:FT_ANIMAL[yp[1]], taisui:ts,
    text:{ self:ftPick(T.self[day],seed,"s"), strength:ftPick(strong?T.strong:T.weak,seed,"st"),
      elements:(cnt[least]<.5?T.lack[least]+"建議"+FT_LUCK[least].act+"，補一點"+least+"氣。":"五行算是有齊，")+T.much[most],
      work:ftPick(C.work,seed,"w"), money:ftPick(C.money,seed,"m"), love:ftPick(C.love,seed,"l"),
      year:ftPick(T.year[yCat],seed+yp,"y"), taisui:T.taisui[ts], verdict },
    luck:{ el:fav, ...FT_LUCK[fav], good:goodMonths, bad:badMonths, avoid } }; }

/* ================= 歌仔戲台 (event) ================= */
// The chair puts a 歌仔戲 stage out between the 天公爐 and the Guanyin fountain, facing the temple. Three pairs of performers
// take turns forever: a pair comes on, performs (亮相, 雲手, 圓場, 水袖, 對唱), goes back behind the backdrop and vanishes, and
// the next pair comes out. The three tracks play in turn. Music and singing fade in as you walk up and fade out as you leave.
// Everything is computed from the time the stage went up, so every player sees the same moment of the show.
var OP={x:0,z:HZ+YX+11.6,k:9.6,on:false,at:0,built:false,root:null,actors:[],spots:[],beams:[],neon:[],glowMats:[],prox:0,cue:"",musicGain:null,voiceGain:null,aud:null,track:-1,lastSync:0};
const OP_TRACKS=[["opera1.mp3",147.38],["opera2.mp3",154.04],["opera3.mp3",143.05]], OP_TOTAL=OP_TRACKS.reduce((a,t)=>a+t[1],0);
const OP_GROUP=56, OP_ENTER=6, OP_EXIT=48, OP_GONE=53, OP_MOVE=8.4; // seconds within each pair's turn; five moves of 8.4 s
const opW=(lx,lz)=>[OP.x-lx*OP.k, OP.z-lz*OP.k]; // stage-local → world; the stage is turned round to face the temple
const opDeck=lz=>(.152-lz*.05)*OP.k;           // the deck slopes a touch towards the audience
function opRect(){ return {x0:OP.x-.5*OP.k-.25, x1:OP.x+.5*OP.k+.25, z0:OP.z-.3*OP.k, z1:OP.z+.3*OP.k}; }
function opInside(x,z){ if(!OP||!OP.on) return false; const r=opRect(); return x>r.x0&&x<r.x1&&z>r.z0&&z<r.z1; }

/* ---- the troupe: 生 旦 淨 末 丑 and a 刀馬旦, in three pairs ---- */

  {key:"sheng", name:"小生",  look:[0,0,0,6,4,2,0,0,1,0,0,0,0], face:"jun",  pitch:235, group:0, side: 1, sleeves:1, extra:"wensheng"},
  {key:"dan",   name:"小旦",  look:[0,11,0,7,7,0,0,0,1,0,0,0,0],face:"dan",  pitch:500, group:0, side:-1, sleeves:1, extra:"toumian"},
  {key:"mo",    name:"老生",  look:[0,0,0,6,3,0,0,0,1,0,0,0,0], face:"mo",   pitch:170, group:1, side: 1, sleeves:1, extra:"wusha"},
  {key:"jing",  name:"花臉",  look:[0,0,0,12,0,1,0,0,1,0,0,0,0],face:"jing", pitch:128, group:1, side:-1, sleeves:0, extra:"kao", rough:1},
  {key:"chou",  name:"丑角",  look:[0,0,0,0,4,2,0,0,1,0,0,0,0], face:"chou", pitch:300, group:2, side: 1, sleeves:0, extra:"chou", quick:1},
  {key:"wudan", name:"刀馬旦",look:[0,11,0,7,3,0,0,0,1,0,0,0,0],face:"dan",  pitch:540, group:2, side:-1, sleeves:0, extra:"lingzi"}];

// heavy stage make-up painted on the same 512×256 face layout as faceTexture (face centred at x 128, eyes at y 140)
function operaFace(kind){ return cvs(512,256,(x,w,h)=>{ const cx=128, ey=140, my=ey+26; x.lineCap="round"; x.lineJoin="round";
  x.fillStyle={jun:"#f9eee6",dan:"#fcf1ea",mo:"#efd3bd",jing:"#c42a1e",chou:"#e8c2a0"}[kind]; x.fillRect(0,0,w,h);
  if(kind!=="jing"&&kind!=="chou") for(const s of [-1,1]){ // 俊扮: deep rouge round the eyes fading out over the cheeks
    const g=x.createRadialGradient(cx+s*24,ey+6,3,cx+s*26,ey+10,kind==="mo"?30:46);
    g.addColorStop(0,kind==="dan"?"rgba(222,30,72,.95)":"rgba(205,36,48,.85)"); g.addColorStop(.55,kind==="dan"?"rgba(238,86,120,.55)":"rgba(216,78,86,.38)"); g.addColorStop(1,"rgba(240,150,160,0)");
    x.fillStyle=g; x.fillRect(0,0,w,h); }
  if(kind==="jing"){ // 花臉: red face, black sweeping brows and eye sockets, white bridge, gold mark on the brow
    x.fillStyle="#141010"; for(const s of [-1,1]){ x.beginPath(); x.moveTo(cx+s*5,ey-4); x.quadraticCurveTo(cx+s*26,ey-50,cx+s*64,ey-24); x.quadraticCurveTo(cx+s*40,ey-24,cx+s*12,ey+6); x.fill();
      x.beginPath(); x.ellipse(cx+s*28,ey+3,21,14,s*.3,0,7); x.fill(); x.beginPath(); x.moveTo(cx+s*44,ey+10); x.quadraticCurveTo(cx+s*58,ey+30,cx+s*40,ey+48); x.lineWidth=6; x.strokeStyle="#141010"; x.stroke(); }
    x.fillStyle="#fbf6ee"; x.beginPath(); x.moveTo(cx-5,ey-34); x.lineTo(cx+5,ey-34); x.lineTo(cx+10,ey+22); x.lineTo(cx-10,ey+22); x.closePath(); x.fill();
    x.fillStyle="#e9b23a"; x.beginPath(); x.ellipse(cx,ey-46,7,11,0,0,7); x.fill(); }
  if(kind==="chou"){ x.fillStyle="#fbfbf4"; x.beginPath(); if(x.roundRect) x.roundRect(cx-30,ey-18,60,44,9); else x.rect(cx-30,ey-18,60,44); x.fill(); } // 豆腐塊
  for(const s of [-1,1]){ const ex=cx+s*26; // almond eyes with liner swept up to the temples, brows slanting up
    if(kind==="jing"){ x.fillStyle="#fff"; x.beginPath(); x.ellipse(ex,ey+1,9,6,0,0,7); x.fill(); }
    else { x.fillStyle="#fff"; x.beginPath(); x.ellipse(ex,ey,11,7,0,0,7); x.fill(); }
    x.fillStyle="#1a1210"; x.beginPath(); x.arc(ex,ey+(kind==="jing"?1:0),5.2,0,7); x.fill(); x.fillStyle="#fff"; x.beginPath(); x.arc(ex+2,ey-2,1.6,0,7); x.fill();
    if(kind!=="jing"){ x.strokeStyle="#120c0a"; x.lineWidth=3.2; x.beginPath(); x.moveTo(ex-s*12,ey+1); x.quadraticCurveTo(ex,ey-9,ex+s*17,ey-9); x.stroke();
      x.lineWidth=kind==="mo"?5.5:4.2; x.beginPath(); x.moveTo(ex-s*11,ey-15); x.quadraticCurveTo(ex+s*3,ey-25,ex+s*19,ey-32); x.stroke(); } }
  x.fillStyle=kind==="jing"?"#141010":"#c10f22"; x.beginPath(); x.ellipse(cx,my,kind==="dan"?5.5:8,kind==="dan"?5:3.8,0,0,7); x.fill();
  if(kind==="dan"){ x.fillStyle="#120c0a"; for(let i=-3;i<=3;i++){ x.beginPath(); x.arc(cx+i*21,ey-60+Math.abs(i)*7,10,0,7); x.fill(); } } // 片子 curls framing the brow
  if(kind==="chou"){ x.strokeStyle="#120c0a"; x.lineWidth=3; for(const s of [-1,1]){ x.beginPath(); x.moveTo(cx+s*3,my-9); x.lineTo(cx+s*17,my-14); x.stroke(); } } }); }

// headdresses, beards, flags and 水袖 built onto an ordinary avatar
function opDress(av,r){ const H=av.head, gold=mat("#e2b04a",{metalness:.7,roughness:.3}), black=mat("#141010",{roughness:.6});
  const hm=H.children.find(o=>o.isMesh); if(hm){ hm.material=new T.MeshStandardMaterial({map:operaFace(r.face),roughness:.55}); }
  if(r.extra==="wensheng"){ // 文生巾: soft scholar's cap with two ribbons down the back
    const cap=mat("#24467e",{roughness:.6}); mk(H,new T.BoxGeometry(.36,.2,.32),cap,0,.24,-.02); mk(H,new T.BoxGeometry(.38,.045,.34),mat("#f2ece0"),0,.15,-.02); mk(H,new T.SphereGeometry(.045,10,8),mat("#f2ece0"),0,.27,.16);
    for(const s of [-1,1]) mk(H,new T.BoxGeometry(.07,.4,.012),mat("#24467e",{roughness:.7,side:T.DoubleSide}),s*.08,-.03,-.26,.12); }
  if(r.extra==="toumian"||r.extra==="lingzi"){ // 頭面: an arc of pearls and jewels across the brow, tassels at the sides
    for(let i=0;i<11;i++){ const a=-1.15+i*.23; mk(H,G.hand,i%2?mat("#fff6f0",{roughness:.25}):mat("#ff6fa0",{roughness:.3}),Math.sin(a)*.27,.16+Math.cos(a*1.6)*.04,Math.cos(a)*.15,0,0,0,.42,.42,.42); }
    mk(H,new T.SphereGeometry(.07,12,8),mat("#e2405c",{roughness:.4}),0,.27,-.06);
    for(const s of [-1,1]) for(let j=0;j<5;j++) mk(H,G.hand,mat(j%2?"#fff6f0":"#e2b04a",{roughness:.3}),s*.25,.04-j*.06,.06,0,0,0,.26,.26,.26); }
  if(r.extra==="lingzi"){ // 翎子: two long pheasant plumes curving up and back
    for(const s of [-1,1]){ const c=new T.CatmullRomCurve3([new T.Vector3(s*.08,.26,.08),new T.Vector3(s*.2,.7,.05),new T.Vector3(s*.42,1.0,-.25),new T.Vector3(s*.62,.92,-.6)]);
      mk(H,new T.TubeGeometry(c,24,.012,5),mat("#9b6a3a",{roughness:.6})); const tip=c.getPoint(1); mk(H,new T.SphereGeometry(.03,8,6),mat("#f4ead2"),tip.x,tip.y,tip.z); }
    for(const s of [-1,1]) mk(av.torso,new T.BoxGeometry(.05,.05,.05),gold,s*.2,.42,.0); }
  if(r.extra==="wusha"){ // 烏紗帽 with its two flat wings, and a long black 三綹髯 beard
    mk(H,new T.CylinderGeometry(.25,.27,.18,20),black,0,.19,-.01); mk(H,new T.SphereGeometry(.15,14,8,0,Math.PI*2,0,Math.PI/2),black,0,.26,-.12);
    for(const s of [-1,1]) mk(H,new T.BoxGeometry(.34,.03,.07),black,s*.34,.24,-.16,0,0,s*.08);
    for(const [xo,len] of [[0,.42],[-.07,.34],[.07,.34]]) mk(H,new T.BoxGeometry(.06,len,.015),mat("#151010",{roughness:.9,side:T.DoubleSide}),xo,-.1-len/2,.23,-.12); }
  if(r.extra==="kao"){ // 花臉 general: helmet with red pompoms, four 靠旗 flags fanning out of the back
    mk(H,new T.SphereGeometry(.285,20,12,0,Math.PI*2,0,Math.PI*.42),gold,0,.03,0); mk(H,new T.ConeGeometry(.06,.2,10),gold,0,.36,0);
    for(let i=0;i<5;i++){ const a=-1+i*.5; mk(H,new T.SphereGeometry(.05,10,8),mat("#e0202a",{roughness:.6}),Math.sin(a)*.26,.24,Math.cos(a)*.14); }
    const flagGeo=new T.BufferGeometry(); flagGeo.setAttribute("position",new T.Float32BufferAttribute([0,0,0, .02,.62,0, .3,.62,0],3)); flagGeo.computeVertexNormals();
    for(let i=0;i<4;i++){ const a=(i-1.5)*.38; const f=new T.Group(); f.position.set(0,.52,-.2); f.rotation.set(-.25,0,a); av.torso.add(f);
      mk(f,new T.CylinderGeometry(.008,.008,.7,5),gold,0,.35,0); mk(f,flagGeo,mat(i%2?"#f0c33a":"#3d8a4e",{side:T.DoubleSide,roughness:.7}),0,.06,0); } }
  if(r.extra==="chou"){ mk(H,new T.SphereGeometry(.275,18,10,0,Math.PI*2,0,Math.PI*.36),black,0,.04,0); mk(H,new T.TorusGeometry(.268,.02,6,24),mat("#e0202a"),0,.13,0,Math.PI/2); }
  av.sleeves=[]; if(r.sleeves) av.hands.forEach((h,i)=>{ const s=new T.Group(); s.position.y=-.02; h.add(s); // 水袖: long white silk hanging from each cuff
    const g=new T.PlaneGeometry(.13,.5); g.translate(0,-.25,0); mk(s,g,mat("#fbf8f2",{side:T.DoubleSide,roughness:.9})); av.sleeves.push(s); });
  av.root.visible=false; }

/* ---- the stage itself: model, coloured spotlights with visible beams, neon tubes and footlights ---- */
function opBuild(){ if(OP.built) return; OP.built=true;
  const root=new T.Group(); root.userData.noMerge=1; root.position.set(OP.x,0,OP.z); root.rotation.y=Math.PI; root.visible=false; scene.add(root); OP.root=root; const k=OP.k;
  loadModel("stage",m=>{ m.scale.setScalar(k); m.traverse(o=>{ if(o.isMesh&&o.material&&o.material.map){ const mt=o.material; mt.emissiveMap=mt.map; mt.emissive=new T.Color("#ffffff"); mt.emissiveIntensity=.25; OP.glowMats.push(mt); } }); root.add(m); });
  // neon tubes (螢光燈) round the proscenium and along the deck edge, segment colours chase round
  const tube=(a,b,n)=>{ if(Q.lite) n=Math.max(2,n>>1); for(let i=0;i<n;i++){ const p=a.clone().lerp(b,(i+.5)/n), len=a.distanceTo(b)/n; const m=new T.MeshBasicMaterial({color:new T.Color(),toneMapped:false});
      const t=new T.Mesh(new T.CylinderGeometry(.03,.03,len*.92,6),m); t.position.copy(p); t.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),b.clone().sub(a).normalize()); root.add(t);
      const gm=new T.SpriteMaterial({map:glowTex,color:new T.Color(),transparent:true,opacity:.55,blending:T.AdditiveBlending,depthWrite:false}); const sp=new T.Sprite(gm); sp.position.copy(p); sp.scale.set(.75,.75,1); if(!Q.lite) root.add(sp);
      OP.neon.push({m,gm,u:OP.neon.length}); } };
  const V=(x,y,z)=>new T.Vector3(x*k,y*k,z*k);
  tube(V(-.46,.148,.16),V(.46,.148,.16),18);                  // deck edge
  tube(V(-.415,.16,.16),V(-.415,.5,.16),8); tube(V(.415,.16,.16),V(.415,.5,.16),8); // pillars
  tube(V(-.415,.5,.16),V(.415,.5,.16),18);                    // under the 天后歌劇團 banner
  for(let i=0;i<9;i++){ const sp=new T.Sprite(new T.SpriteMaterial({map:glowTex,color:new T.Color("#ffe2a0"),transparent:true,opacity:.7,blending:T.AdditiveBlending,depthWrite:false})); sp.position.copy(V(-.36+i*.09,.16,.13)); sp.scale.set(.5,.5,1); root.add(sp); } // footlights
  // three moving coloured spotlights from the truss, each with a soft visible beam
  const beamGeo=new T.CylinderGeometry(.15,2.2,1,20,1,true); beamGeo.translate(0,-.5,0);
  for(let i=0;i<3;i++){ const from=V((i-1)*.3,.6,.22); const sl=Q.low?null:new T.SpotLight(0xffffff,0,22,.42,.55,1.2); const tgt=new T.Object3D(); root.add(tgt);
    if(sl){ sl.position.copy(from); sl.target=tgt; root.add(sl); }
    const bm=new T.MeshBasicMaterial({color:new T.Color(),transparent:true,opacity:.11,blending:T.AdditiveBlending,depthWrite:false,side:T.DoubleSide,toneMapped:false}); const beam=new T.Mesh(beamGeo,bm); beam.position.copy(from); root.add(beam);
    OP.spots.push({sl,tgt,beam,bm,from,i}); }
  OP_ROLES.forEach(r=>{ const [x,z]=opW(r.side*.3,-.11); const av=new Avatar(r.look,{npc:true,x,z}); av.moveSpeed=0; av.sjBusy=1; av.root.scale.setScalar(1.35); /* a touch larger than life so they read on the big stage */ opDress(av,r); OP.actors.push({av,role:r}); }); }

function opSet(on,at){ const was=OP.on; OP.on=!!on; OP.at=at||Date.now(); if(OP.on) opBuild(); if(OP.root) OP.root.visible=OP.on; if(!OP.on){ OP.actors.forEach(a=>a.av.root.visible=false); if(OP.aud){ OP.aud.pause(); } }
  if(OP.on&&!was&&Date.now()-OP.at<60000) toast("🎭 主委擺出歌仔戲台了！到廟埕看戲",4200); if(sheetKind==="chair"&&me.sp) openChair(); }
async function opFetch(){ try{ const r=await fetch("/stage",{cache:"no-store"}); if(!r.ok) return; const j=await r.json(); if(j&&(!!j.on!==OP.on||(j.on&&j.at!==OP.at))) opSet(j.on,+j.at||0); }catch(e){} }

    if(j.ok){ save("mz.rk",key); opSet(j.on,j.at); if(sheetKind==="chair") openChair(); toast(j.on?"歌仔戲台已擺出，戲班開演":"歌仔戲台已收回",3000); }
    else toast(r.status===503?"伺服器今天額度用完了，晚點再試":j.locked?"嘗試次數過多，今天先鎖住了":j.unset?"伺服器讀不到密碼設定（不是你打錯）":"密碼不對，沒有變更",3200); }catch(e){ toast("沒有變更，請稍後再試"); } b.disabled=false; };

/* ---- sound: the three tracks in turn, plus synthesized Taiwanese-style singing, both fading with distance ---- */
function opAudioNodes(){ const a=ac; if(!a) return false; if(!OP.voiceGain){ OP.voiceGain=a.createGain(); OP.voiceGain.gain.value=0; OP.voiceGain.connect(sfxBus(a)); }
  if(!OP.aud){ OP.aud=new Audio(); OP.aud.preload="none"; OP.aud.loop=false; try{ const src=a.createMediaElementSource(OP.aud); OP.musicGain=a.createGain(); OP.musicGain.gain.value=0; src.connect(OP.musicGain).connect(a.destination) /* stage music: its own gain, not the effects bus */; }catch(e){ OP.musicGain=null; } }
  return true; }
function opTrackAt(){ let t=((Date.now()-OP.at)/1000)%OP_TOTAL; for(let i=0;i<OP_TRACKS.length;i++){ if(t<OP_TRACKS[i][1]) return [i,t]; t-=OP_TRACKS[i][1]; } return [0,0]; }
function opMusic(dt){ const want=OP.on&&soundOn&&audioUnlocked&&OP.prox>.01; if(!want){ if(OP.aud&&!OP.aud.paused) OP.aud.pause(); return; } if(!opAudioNodes()) return;
  const [ti,off]=opTrackAt(); const now=performance.now();
  if(OP.track!==ti||OP.aud.paused||(now-OP.lastSync>4000&&Math.abs(OP.aud.currentTime-off)>2.5)){ OP.lastSync=now;
    if(OP.track!==ti){ OP.track=ti; OP.aud.src=OP_TRACKS[ti][0]; } try{ OP.aud.currentTime=off; }catch(e){} const p=OP.aud.play(); if(p&&p.catch) p.catch(()=>{}); }
  const v=OP.prox*mVol()*.42; if(OP.musicGain) OP.musicGain.gain.setTargetAtTime(v,ac.currentTime,.12); else OP.aud.volume=Math.min(1,v); }
// one sung or spoken syllable: a sawtooth voice through two vowel formants, Taiwanese-like tone contour, vibrato on long notes
const OP_VOWELS=[[800,1200],[400,2200],[300,2700],[500,900],[350,800],[600,1700]];
function opSyllable(a,r,at,dur,f0,contour,sung){ const o=a.createOscillator(); o.type=r.rough?"square":"sawtooth";
  const ends={hi:1,fall:.72,low:.85,rise:1.28,dip:1.1,stop:.92}[contour]||1; o.frequency.setValueAtTime(f0,at);
  if(contour==="dip"){ o.frequency.linearRampToValueAtTime(f0*.86,at+dur*.45); o.frequency.linearRampToValueAtTime(f0*ends,at+dur); } else o.frequency.linearRampToValueAtTime(f0*ends,at+dur*(sung?.35:1));
  if(sung&&dur>.5){ const lfo=a.createOscillator(), lg=a.createGain(); lfo.frequency.value=5.6; lg.gain.setValueAtTime(0,at); lg.gain.linearRampToValueAtTime(f0*ends*.03,at+dur*.6); lfo.connect(lg).connect(o.frequency); lfo.start(at); lfo.stop(at+dur+.05); }
  const out=a.createGain(), peak=(sung?.38:.3)*(r.rough?.6:1); out.gain.setValueAtTime(0,at); out.gain.linearRampToValueAtTime(peak,at+.02);
  if(contour==="stop") out.gain.setValueAtTime(peak,at+dur*.85); out.gain.linearRampToValueAtTime(0,at+dur); out.connect(OP.voiceGain);
  const fm=OP_VOWELS[(Math.random()*OP_VOWELS.length)|0]; for(const fr of fm){ const bp=a.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=fr*(r.pitch>400?1.25:1.05); bp.Q.value=r.quick?9:6; o.connect(bp).connect(out); } { const lp=a.createBiquadFilter(), body=a.createGain(); lp.type="lowpass"; lp.frequency.value=f0*3.2; body.gain.value=.22; o.connect(lp).connect(body).connect(out); } /* a little of the raw voice under the vowels makes it fuller and easier to hear over the band */
  o.start(at); o.stop(at+dur+.05); }
// a line of 唱 (slow, pentatonic, drawn-out last note) or 口白 (quick patter with checked syllables), speeding up and slowing down
function opVoice(r,sung,len){ const a=ac; if(!a||!OP.voiceGain||!soundOn||document.hidden) return; let t=a.currentTime+.05; const end=t+len, SC=[0,2,4,7,9,12], C=["hi","fall","low","rise","dip","stop"];
  let deg=2; while(t<end-.3){ let dur, f; const rate=r.quick?1.6:1;
    if(sung){ deg=Math.max(0,Math.min(SC.length-1,deg+((Math.random()*3)|0)-1)); f=r.pitch*Math.pow(2,SC[deg]/12); const last=t>end-1.9; dur=last?Math.min(1.8,end-t):(.24+Math.random()*.5)/rate; opSyllable(a,r,t,dur,f,last?"hi":C[(Math.random()*5)|0],true); t+=dur+.04; if(last) break; }
    else { const burst=2+((Math.random()*4)|0); for(let i=0;i<burst&&t<end;i++){ const c=C[(Math.random()*C.length)|0]; dur=c==="stop"?.07:(.09+Math.random()*.11)/rate; f=r.pitch*(.9+Math.random()*.25); opSyllable(a,r,t,dur,f,c,false); t+=dur+.015; } t+=.12+Math.random()*.25; } } }

/* ---- every frame: where each performer is, what they are doing, lights, and how loud it all is ---- */
const opSmooth=u=>u<=0?0:u>=1?1:u*u*(3-2*u);
function opActor(A,gi,gt,el,dt){ const r=A.role, av=A.av; if(r.group!==gi||gt>=OP_GONE){ av.root.visible=false; return; } av.root.visible=true;
  const wing=[r.side*.31,-.115], mark=[r.side*.12,.035]; let lx, lz, moving=false, face=Math.PI, move=-1, mt=0;
  if(gt<OP_ENTER){ const u=opSmooth(gt/(OP_ENTER-.6)); lx=wing[0]+(mark[0]-wing[0])*u; lz=wing[1]+(mark[1]-wing[1])*u; moving=u<1; }
  else if(gt<OP_EXIT){ const pt=gt-OP_ENTER; move=(Math.floor(pt/OP_MOVE)+gi)%5; mt=pt%OP_MOVE; lx=mark[0]; lz=mark[1];
    if(move===2){ const ang=mt/OP_MOVE*Math.PI*2*(r.side>0?1:-1); lx=mark[0]-r.side*.06+r.side*Math.cos(ang)*.06; lz=mark[1]+Math.sin(ang)*.05; moving=true; } } // 圓場: quick tiny steps round a circle
  else { const u=opSmooth((gt-OP_EXIT)/(OP_GONE-OP_EXIT-.8)); lx=mark[0]+(wing[0]-mark[0])*u; lz=mark[1]+(wing[1]-mark[1])*u; moving=u<1; }
  const [wx,wz]=opW(lx,lz); const prev=A.last||[wx,wz]; const vx=wx-prev[0], vz=wz-prev[1]; A.last=[wx,wz];
  if(moving&&Math.hypot(vx,vz)>1e-4) face=Math.atan2(vx,vz); if(move===4){ const P=OP.actors.find(o=>o!==A&&o.role.group===gi); if(P&&P.last) face=lerpAngle(Math.PI,Math.atan2(P.last[0]-wx,P.last[1]-wz),.55); }
  av.pos.set(wx,wz); av.target.set(wx,wz); av.faceGoal=face; av.update(dt); if(moving) av.rotY=lerpAngle(av.rotY,face,Math.min(1,dt*10)); av.root.rotation.y=av.rotY; av.root.position.y=opDeck(lz);
  const t=el, s0=-1, s1=1, a0=av.arms[0], a1=av.arms[1]; let tx=0, tz=0, ty=0, hy=0;
  if(moving){ const w=Math.sin(t*16); av.legs[0].rotation.x=w*.35; av.legs[1].rotation.x=-w*.35; av.hips.position.y=.3+Math.abs(Math.cos(t*16))*.015; a0.rotation.set(-.35,0,-.7); a1.rotation.set(-.35,0,.7); }
  else if(move===0){ const hold=Math.min(1,mt*3); a1.rotation.set(-.2,0,2.4*hold); a0.rotation.set(-1.2*hold,0,-.5); tz=.12*hold; hy=.45*hold*(r.side); }      // 亮相: freeze in a pose
  else if(move===1){ const p=t*2.3*(r.side); a0.rotation.set(-.9+Math.cos(p)*.6,0,-(.7+Math.sin(p)*.6)); a1.rotation.set(-.9-Math.cos(p)*.6,0,.7-Math.sin(p)*.6); ty=Math.sin(p/2)*.35; } // 雲手
  else if(move===3){ const cyc=(mt*.75)%1, flick=cyc<.2?Math.sin(cyc/.2*Math.PI/2):Math.max(0,1-(cyc-.2)*1.6), side=Math.floor(mt*.75)%2; // 甩水袖 / 開打
    if(side){ a1.rotation.set(-.4,0,.3+2.3*flick); a0.rotation.set(-.7,0,-.4); } else { a0.rotation.set(-.4,0,-.3-2.3*flick); a1.rotation.set(-.7,0,.4); } tz=(side?.1:-.1)*flick; }
  else if(move===4){ a1.rotation.set(-1.45,0,.25); a0.rotation.set(-.5,0,-.9); hy=Math.sin(t*3)*.15; }                             // 對唱: point to the partner
  else { a0.rotation.set(-.6,0,-.35); a1.rotation.set(-.6,0,.35); }
  av.torso.rotation.set(0,ty,tz); av.head.rotation.y=hy; av.head.rotation.z=Math.sin(t*1.7)*.05;
  if(av.sleeves) av.sleeves.forEach((s,i)=>{ const arm=av.arms[i]; s.rotation.z=-arm.rotation.z*.75+Math.sin(t*5+i)*.08; s.rotation.x=-arm.rotation.x*.6; });
  // singing: in each move one performer sings the first half and the other answers; 圓場 is instrumental
  if(move>=0&&move!==2&&OP.prox>.03){ const half=mt<OP_MOVE/2?0:1, singer=(r.side>0?0:1)===((half+move)%2); const cue=`${gi}:${Math.floor((gt-OP_ENTER)/OP_MOVE)}:${half}:${r.key}`;
    const left=OP_MOVE/2-mt%(OP_MOVE/2)-.3; if(singer&&!A.cues) A.cues=new Set(); if(singer&&!A.cues.has(cue)&&left>1.2){ A.cues.add(cue); if(A.cues.size>40) A.cues=new Set([cue]); opVoice(r,move!==4||r.key==="chou"?Math.random()<.7:false,left); } } }
function opTick(dt){ if(!OP.on||!OP.root){ opMusic(dt); if(OP.voiceGain) OP.voiceGain.gain.value=0; return; }
  const d=Math.hypot(meAv.pos.x-OP.x,meAv.pos.y-(OP.z-.3*OP.k)); const want=d<4?1:d>14?0:1-(d-4)/10; /* full within 4 m of the stage front, silent past 14 m */ OP.prox+=(want-OP.prox)*Math.min(1,dt*1.2);
  const el=(Date.now()-OP.at)/1000, gi=Math.floor(el/OP_GROUP)%3, gt=el%OP_GROUP;
  OP.actors.forEach(A=>opActor(A,gi,gt,el,dt));
  const nt=_dn.night||0; OP.glowMats.forEach(m=>m.emissiveIntensity=.2+.45*nt);
  OP.neon.forEach(o=>{ const h=(o.u/14-el*.25)%1; o.m.color.setHSL((h+1)%1,1,.55); o.gm.color.setHSL((h+1)%1,1,.6); o.gm.opacity=.35+.35*nt; });
  OP.spots.forEach(s=>{ const h=(el*.05+s.i/3)%1, sw=Math.sin(el*.7+s.i*2.1); const aim=new T.Vector3((s.i-1)*.12*OP.k+sw*.9,.15*OP.k,.02*OP.k+Math.cos(el*.5+s.i)*.4);
    s.tgt.position.copy(aim); if(s.sl){ s.sl.color.setHSL(h,1,.55); s.sl.intensity=(1.6+1.6*nt); }
    const dir=aim.clone().sub(s.from), L=dir.length(); s.beam.scale.set(1,L,1); s.beam.quaternion.setFromUnitVectors(new T.Vector3(0,-1,0),dir.normalize()); s.bm.color.setHSL(h,1,.5); s.bm.opacity=.05+.08*nt; });
  if(OP.voiceGain&&ac) OP.voiceGain.gain.setTargetAtTime(OP.prox*sVol()*(soundOn?1:0),ac.currentTime,.12);
  opMusic(dt); }

/* ================= 布袋戲台 (event) ================= */
// The chair puts a 布袋戲 stage out in front of the 天公爐, between the four stone lamps, facing the temple like the opera stage. Six little puppets take turns
// in pairs, forever: a pair pops in through the stage window, talks, chases, fights, flies and whirls, one wins, both leave, and
// the next pair comes on. The 歌仔戲 tracks play; clangs, gongs, whooshes and squeaky puppet voices are synthesized. The chair's
// line of text hangs on a red cloth over the phoenix-and-lotus panel, and tapping the stage shows it.
// Everything runs from the time the stage went up, so every player sees the same moment of the show.
var PT={x:0,z:HZ+15,k:5.98,rot:Math.PI,on:false,at:0,text:"",built:false,root:null,actors:[],glowMats:[],spots:[],lasers:[],fog:[],sparks:[],flash:null,banner:null,hit:null,prox:0,aud:null,musicGain:null,voiceGain:null,track:-1,lastSync:0,cues:new Set()};
const PT_PAIR=40, PT_FLOOR=.335, PT_DEPTH=.07, PT_HALF=.155; // model units: window floor height, depth of the puppets, half the window width
const ptW=(lx,ly,lz)=>new T.Vector3(PT.x-lx*PT.k, ly*PT.k, PT.z-lz*PT.k); // stage-local (model units) → world; the stage is turned round to face the temple
function ptRect(){ return {x0:PT.x-.5*PT.k-.2, x1:PT.x+.5*PT.k+.2, z0:PT.z-.15*PT.k-.25, z1:PT.z+.15*PT.k+.25}; }
function ptInside(x,z){ if(!PT||!PT.on) return false; const r=ptRect(); return x>r.x0&&x<r.x1&&z>r.z0&&z<r.z1; }

  {name:"黑面魔頭", face:"jing", extra:"demon",    robe:"#2a1838", trim:"#9b3fd0", pitch:118, weapon:"claw",  look:[0,0,0,6,0,1,0,0,1,0,0,0,0], rough:1},
  {name:"紅衣女俠", face:"dan",  extra:"lingzi",   robe:"#e8506e", trim:"#ffd36a", pitch:560, weapon:"sword", look:[0,11,0,7,7,0,0,0,1,0,0,0,0]},
  {name:"金甲將軍", face:"jing", extra:"kao",      robe:"#c99a2e", trim:"#b5161c", pitch:140, weapon:"spear", look:[0,0,0,6,3,0,0,0,1,0,0,0,0], rough:1},
  {name:"白髮道長", face:"mo",   extra:"taoist",   robe:"#7c8aa0", trim:"#f2e6c4", pitch:200, weapon:"whisk", look:[0,0,0,6,3,0,0,0,1,0,0,0,0]},

function ptRobeTex(base,trim){ return cvs(256,256,(x,w,h)=>{ x.fillStyle=base; x.fillRect(0,0,w,h);
  x.strokeStyle=trim; x.globalAlpha=.55; x.lineWidth=5; for(let i=0;i<7;i++){ const cx=(i*61)%w, cy=40+(i*97)%200; x.beginPath(); x.arc(cx,cy,16,Math.PI*.2,Math.PI*1.7); x.arc(cx+20,cy-6,10,Math.PI,Math.PI*2.2); x.stroke(); } // embroidered clouds
  x.globalAlpha=1; x.fillStyle="#e6b84a"; x.fillRect(0,h-26,w,14); x.fillStyle=trim; x.fillRect(0,h-12,w,12); x.fillRect(0,0,w,10); }); }

  const t=(text||"").trim(); if(!t) return; let fs=150; x.font=`900 ${fs}px "Noto Serif TC","Songti TC","PMingLiU",${UI_FONT}`; while(x.measureText(t).width>w-110&&fs>40){ fs-=6; x.font=`900 ${fs}px "Noto Serif TC","Songti TC","PMingLiU",${UI_FONT}`; }
  x.textAlign="center"; x.textBaseline="middle"; x.lineJoin="round"; x.lineWidth=fs*.12; x.strokeStyle="#5a0608"; x.strokeText(t,w/2,h/2+4); const gg=x.createLinearGradient(0,h/2-fs/2,0,h/2+fs/2); gg.addColorStop(0,"#fff3b0"); gg.addColorStop(.5,"#ffd34a"); gg.addColorStop(1,"#e09a1c"); x.fillStyle=gg; x.fillText(t,w/2,h/2+4); }); }
function ptSetBanner(){ if(!PT.banner) return; const m=PT.banner.material; if(m.map) m.map.dispose(); m.map=ptBannerTex(PT.text); m.emissiveMap=m.map; m.emissive.set("#ffffff"); m.emissiveIntensity=.35; m.color.set("#d8d8d8"); m.needsUpdate=true; PT.banner.visible=!!(PT.text||"").trim(); }

  for(const s of [-1,1]){ mk(root,new T.CylinderGeometry(.012*k,.012*k,.02*k,8),mat("#e2b04a",{metalness:.7,roughness:.3}),s*.3*k,.305*k,.11*k); // brass rings it hangs from
    const tas=new T.Group(); tas.position.set(s*.3*k,.3*k,.112*k); root.add(tas); for(let j=0;j<5;j++) mk(tas,new T.BoxGeometry(.006*k,.05*k,.003*k),mat("#f5c84a"),(j-2)*.006*k,-.03*k,0); }

/* ---- sound: the 歌仔戲 tracks, synthesized gongs, clangs, whooshes and squeaky 布袋戲 voices, fading with distance ---- */

  let t=((Date.now()-PT.at)/1000)%OP_TOTAL, ti=0; for(;ti<OP_TRACKS.length;ti++){ if(t<OP_TRACKS[ti][1]) break; t-=OP_TRACKS[ti][1]; } ti%=OP_TRACKS.length; const now=performance.now();
  if(PT.track!==ti||PT.aud.paused||(now-PT.lastSync>4000&&Math.abs(PT.aud.currentTime-t)>2.5)){ PT.lastSync=now; if(PT.track!==ti){ PT.track=ti; PT.aud.src=OP_TRACKS[ti][0]; } try{ PT.aud.currentTime=t; }catch(e){} const p=PT.aud.play(); if(p&&p.catch) p.catch(()=>{}); }
  const v=PT.prox*mVol()*.2*(OP.on&&OP.prox>PT.prox?.4:1); if(PT.musicGain) PT.musicGain.gain.setTargetAtTime(v,ac.currentTime,.12); else PT.aud.volume=Math.min(1,v); }
function ptNoise(a,dur){ const n=Math.floor(a.sampleRate*dur), b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; const s=a.createBufferSource(); s.buffer=b; return s; }
const PT_SFX={
  clang(big){ const a=ac, at=a.currentTime+.01, g=a.createGain(); g.gain.setValueAtTime(big?.5:.32,at); g.gain.exponentialRampToValueAtTime(.001,at+(big?1.1:.45)); g.connect(PT.voiceGain); // metal on metal
    for(const f of [1180,1730,2610,3420]){ const o=a.createOscillator(); o.type="triangle"; o.frequency.value=f*(.96+Math.random()*.08); const og=a.createGain(); og.gain.value=.25; o.connect(og).connect(g); o.start(at); o.stop(at+1.2); }
    const n=ptNoise(a,.08), hp=a.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=2500; const ng=a.createGain(); ng.gain.setValueAtTime(.6,at); ng.gain.exponentialRampToValueAtTime(.001,at+.08); n.connect(hp).connect(ng).connect(g); n.start(at); },
  gong(){ const a=ac, at=a.currentTime+.01, g=a.createGain(); g.gain.setValueAtTime(.55,at); g.gain.exponentialRampToValueAtTime(.001,at+2.2); g.connect(PT.voiceGain); // 鑼: a falling shimmer
    for(const [f,amp] of [[220,1],[331,.6],[467,.45],[612,.3]]){ const o=a.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(f*1.06,at); o.frequency.exponentialRampToValueAtTime(f*.94,at+1.8); const og=a.createGain(); og.gain.value=amp*.4; o.connect(og).connect(g); o.start(at); o.stop(at+2.3); } },
  cymbal(){ const a=ac, at=a.currentTime+.01, n=ptNoise(a,.7), bp=a.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=6500; bp.Q.value=.7; const g=a.createGain(); g.gain.setValueAtTime(.35,at); g.gain.exponentialRampToValueAtTime(.001,at+.65); n.connect(bp).connect(g).connect(PT.voiceGain); n.start(at); }, // 鈸
  drum(){ const a=ac, at=a.currentTime+.01, o=a.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(160,at); o.frequency.exponentialRampToValueAtTime(60,at+.18); const g=a.createGain(); g.gain.setValueAtTime(.7,at); g.gain.exponentialRampToValueAtTime(.001,at+.25); o.connect(g).connect(PT.voiceGain); o.start(at); o.stop(at+.3); },
  whoosh(){ const a=ac, at=a.currentTime+.01, n=ptNoise(a,.6), bp=a.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=2; bp.frequency.setValueAtTime(400,at); bp.frequency.exponentialRampToValueAtTime(2600,at+.25); bp.frequency.exponentialRampToValueAtTime(500,at+.55); const g=a.createGain(); g.gain.setValueAtTime(0,at); g.gain.linearRampToValueAtTime(.35,at+.2); g.gain.linearRampToValueAtTime(0,at+.58); n.connect(bp).connect(g).connect(PT.voiceGain); n.start(at); },
  boom(){ const a=ac, at=a.currentTime+.01, n=ptNoise(a,1.2), lp=a.createBiquadFilter(); lp.type="lowpass"; lp.frequency.setValueAtTime(900,at); lp.frequency.exponentialRampToValueAtTime(80,at+1); const g=a.createGain(); g.gain.setValueAtTime(.8,at); g.gain.exponentialRampToValueAtTime(.001,at+1.1); n.connect(lp).connect(g).connect(PT.voiceGain); n.start(at); PT_SFX.gong(); } };
// 布袋戲 口白: one 口白師 voices everyone — quick, sing-song, big swoops up and down; the villain growls, the lady squeaks
const PT_VOW=[[800,1200],[400,2200],[300,2700],[500,900],[350,800],[600,1700]];
function ptSyl(r,at,dur,f0,f1,v,vow){ const a=ac, o=a.createOscillator(); o.type=r.rough?"square":"sawtooth"; o.frequency.setValueAtTime(f0,at); o.frequency.linearRampToValueAtTime(f1,at+dur);
  const out=a.createGain(), pk=(r.rough?.11:.17)*v; out.gain.setValueAtTime(0,at); out.gain.linearRampToValueAtTime(pk,at+.015); out.gain.linearRampToValueAtTime(0,at+dur); out.connect(PT.voiceGain);
  for(const fr of vow||PT_VOW[(Math.random()*PT_VOW.length)|0]){ const bp=a.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=fr*(r.pitch>400?1.3:1.1); bp.Q.value=r.quick?8:6; o.connect(bp).connect(out); } o.start(at); o.stop(at+dur+.05); }
function ptTalk(r,len){ const a=ac; if(!a||!PT.voiceGain) return; let t=a.currentTime+.04; const end=t+len;
  while(t<end-.1){ const burst=2+((Math.random()*5)|0); for(let i=0;i<burst&&t<end;i++){ const d=(.07+Math.random()*.1)/(r.quick?1.4:1), f=r.pitch*(.85+Math.random()*.35), sw=Math.random(); ptSyl(r,t,d,f,f*(sw<.3?1.45:sw<.6?.72:1.05),1); t+=d+.012; }
    if(Math.random()<.35){ const d=.35+Math.random()*.3, f=r.pitch*1.1; ptSyl(r,t,d,f,f*(Math.random()<.5?1.6:.6),1.1,PT_VOW[0]); t+=d; } t+=.08+Math.random()*.18; } } // a long swooping vowel now and then
function ptLaugh(r){ const a=ac; if(!a||!PT.voiceGain) return; let t=a.currentTime+.04; for(let i=0;i<7;i++){ const f=r.pitch*(1.5-i*.07); ptSyl(r,t,.13,f,f*.9,1.1,[800,1200]); t+=.17; } }
function ptCry(r){ const a=ac; if(!a||!PT.voiceGain) return; const t=a.currentTime+.04, f=r.pitch*1.6; ptSyl(r,t,.55,f,f*.45,1.2,[400,2200]); }

/* ---- every frame ---- */
function ptSpark(p,big){ const n=big?40:12; let c=0; for(const o of PT.sparks){ if(o.life<.5) continue; o.life=0; o.max=big?.9:.45; o.sp.position.copy(p); o.v.set(Math.random()*2-1,Math.random()*1.6-.3,Math.random()*2-1).normalize().multiplyScalar((big?3.2:1.6)*(.5+Math.random()*.7));
    o.sp.material.color.setHSL(big?Math.random():.1+Math.random()*.08,1,.65); o.sp.visible=true; if(++c>=n) break; }
  PT.flash.position.copy(p); PT.flashT=0; PT.flashBig=big; PT.flash.visible=true; }
function ptPose(A,gi,gt){ // where one puppet is: lx (across the window), h (height above the window floor), lz, facing, spin, flip, lean, arms
  const s=A.i%2?1:-1, other=s>0?0:1, winner=(gi%2)===0?0:1, iWin=(A.i%2)===winner; let lx=s*.09, h=0, lz=PT_DEPTH, face=0, spin=0, flip=0, lean=0, arms="rest", phase="";
  const sm=opSmooth;
  if(gt<3){ const u=sm(gt/2.6); lx=s*(.25-.16*u); spin=(1-u)*Math.PI*4; h=Math.abs(Math.sin(u*Math.PI*2))*.035; arms="up"; phase="enter"; }
  else if(gt<9){ const seg=Math.floor((gt-3)/1.5), speaking=(seg%2)===(A.i%2); arms=speaking?"talk":"rest"; h=speaking?Math.abs(Math.sin(gt*9))*.008:0; face=speaking?.6:-.2; phase="talk"; }
  else if(gt<17){ const tt=gt-9; lx=s*.1*Math.cos(tt*Math.PI/2)+.03*Math.sin(tt*Math.PI)*(A.i%2?1:-1); lz=PT_DEPTH+s*.012; h=Math.abs(Math.sin(tt*11))*.016; arms="run"; phase="run"; }
  else if(gt<25){ const tt=gt-17, base=s*(.1-.06*sm(tt)), p=(tt%.55)/.55, att=Math.floor(tt/.55)%2===(A.i%2); lx=base+(att?-s*.028*Math.sin(p*Math.PI):s*.02*Math.max(0,Math.sin((p-.35)*Math.PI*1.5))); lean=att?-.35*Math.sin(p*Math.PI):.25*Math.max(0,Math.sin((p-.35)*Math.PI)); arms=att?"strike":"guard"; A.strikeP=p; phase="fight"; }
  else if(gt<31){ const tt=gt-25; lx=s*.12*Math.cos(Math.PI*tt/3); h=.2*Math.abs(Math.sin(Math.PI*tt/3)); lz=PT_DEPTH+s*.02; flip=(tt/3)*Math.PI*2*(s>0?1:-1); arms="up"; phase="fly"; }
  else if(gt<36){ const tt=gt-31; lx=s*(.06-.02*Math.min(1,tt))+.012*Math.sin(tt*7); spin=tt*14*(s>0?1:-1); h=.02*Math.abs(Math.sin(tt*10))+(tt>4.4?.0:0); arms="strike"; phase="spin"; }
  else if(gt<38.5){ const tt=gt-36; if(iWin){ lx=s*.05; arms="up"; h=Math.abs(Math.sin(tt*6))*.01; face=.3; } else { lx=s*(.05+.09*sm(tt/.6)); h=Math.max(0,.1*Math.sin(Math.min(1,tt/.6)*Math.PI)); lean=Math.min(1.35,tt*3)*-s; arms="rest"; } phase="end"; }
  else { const u=sm((gt-38.5)/1.3); lx=(iWin?s*.05:s*.14)+(s*.26-(iWin?s*.05:s*.14))*u; arms="run"; h=Math.abs(Math.sin(gt*11))*.014; phase="exit"; }
  if(h>.04) lz+=.08*Math.min(1,(h-.04)/.06); // high in the air: out in front of the frame so the stage doesn't hide them
  return {lx,h,lz,face,spin,flip,lean,arms,phase,s,other}; }
function ptTick(dt){ if(!PT.on||!PT.root||!PT.root.visible){ ptMusic(); if(PT.voiceGain) PT.voiceGain.gain.value=0; return; }
  const d=Math.hypot(meAv.pos.x-PT.x,meAv.pos.y-(PT.z-.15*PT.k)); const want=d<4?1:d>14?0:1-(d-4)/10; /* same as the opera stage: full within 4 m of the front, silent past 14 m */ PT.prox+=(want-PT.prox)*Math.min(1,dt*1.2);
  const el=(Date.now()-PT.at)/1000, gi=Math.floor(el/PT_PAIR)%3, gt=el%PT_PAIR, k=PT.k, hear=PT.prox>.03&&soundOn&&ac&&PT.voiceGain&&!document.hidden;
  const cue=(name,fn)=>{ const key=Math.floor(el/PT_PAIR)+":"+name; if(PT.cues.has(key)) return; PT.cues.add(key); if(PT.cues.size>200) PT.cues=new Set([key]); if(hear) try{ fn(); }catch(e){} };
  const poses={}; PT.actors.forEach(A=>{ if(Math.floor(A.i/2)!==gi){ A.av.root.visible=false; A.cur=null; return; } poses[A.i]=ptPose(A,gi,gt); });
  PT.actors.forEach(A=>{ const P=poses[A.i]; if(!P) return; const av=A.av;
    const goal=new T.Vector3(P.lx,P.h,P.lz); if(!A.cur) A.cur=goal.clone(); else A.cur.lerp(goal,Math.min(1,dt*(P.phase==="fly"?18:12)));
    const vis=Math.abs(A.cur.x)<.235; av.root.visible=vis; if(!vis) return;
    const w=ptW(A.cur.x,PT_FLOOR+A.cur.y+.004,A.cur.z); av.root.position.copy(w);
    const Q2=poses[A.i%2?A.i-1:A.i+1], toward=Q2&&Q2.lx>A.cur.x?1:-1; // which way the partner is along the window
    const base=PT.rot+(toward>0?Math.PI/2:-Math.PI/2)*.72; let ry=base+P.face*(toward>0?-1:1);
    av.root.rotation.set(0,ry+P.spin,0); // somersaults and lean turn the body about its middle, not its feet
    { const e=new T.Euler(P.flip,0,P.lean*.6), c=new T.Vector3(0,.6,0); av.parts.rotation.copy(e); av.parts.position.copy(c).sub(c.clone().applyEuler(e)); }
    const t=el, a0=av.arms[0], a1=av.arms[1];

    else if(P.arms==="talk"){ a1.rotation.set(-1.1+Math.sin(t*7)*.4,0,.5+Math.sin(t*5)*.3); a0.rotation.set(-.4,0,-.5); av.head.rotation.z=Math.sin(t*9)*.12; }
    else if(P.arms==="run"){ const sw=Math.sin(t*14); a0.rotation.set(-.6+sw*.5,0,-.6); a1.rotation.set(-.6-sw*.5,0,.6); }
    else if(P.arms==="strike"){ const p=P.phase==="spin"?(t*3)%1:(A.strikeP||0); a1.rotation.set(-2.6+p*2.4,0,.3); a0.rotation.set(-.7,0,-.9); }
    else if(P.arms==="guard"){ a1.rotation.set(-1.6,0,.9); a0.rotation.set(-1.3,0,-.9); }
    else { a0.rotation.set(-.25,0,-.35); a1.rotation.set(-.25,0,.35); }
    av.torso.rotation.y=P.phase==="talk"?Math.sin(t*2)*.15:0; });
  // events: sounds and sparks at fixed moments of the pair's turn
  const pair=PT.actors.filter(A=>Math.floor(A.i/2)===gi), L=pair[0], R=pair[1];
  const mid=()=>{ const a=L.av.root.position, b=R.av.root.position; return a.clone().add(b).multiplyScalar(.5).add(new T.Vector3(0,.32,0)); };
  if(gt<.3) cue("gong0",()=>{ PT_SFX.gong(); setTimeout(()=>PT_SFX.cymbal(),300); });
  if(gt>3&&gt<9){ const seg=Math.floor((gt-3)/1.5); cue("talk"+seg,()=>ptTalk((seg%2?R:L).role,1.35)); }

const NMF=()=>DISPLAY_FONT;
function nmBg(x,W,H,top,bot){ const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,top); g.addColorStop(1,bot); x.fillStyle=g; x.fillRect(0,0,W,H);

/* sparkle, confetti, coins and splashes for the stall games */
const NMFX_COL=["#ffe14d","#ff6b8b","#7dffb0","#6bd6ff","#ffb347","#c58bff","#ffffff"];
function fxBurst(L,px,py,n=14,o={}){ L.fx=L.fx||[]; for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, sp=(o.speed||220)*(.4+Math.random()*.8);
    L.fx.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(o.up||80),g:o.g??420,life:0,max:(o.life||.9)*(.7+Math.random()*.6),r:(o.size||4)*(.6+Math.random()*.8),c:o.cols?o.cols[(Math.random()*o.cols.length)|0]:NMFX_COL[(Math.random()*NMFX_COL.length)|0],k:o.kind||"spark",rot:Math.random()*7,vr:(Math.random()-.5)*12}); } }
function fxDraw(L,x,W,H){ const now=performance.now(), dt=Math.min(.05,(now-(L.fxT||now))/1000); L.fxT=now; L.fx=L.fx||[];
  if(L.rain&&now<L.rain){ for(let i=0;i<3;i++) L.fx.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*60,vy:120+Math.random()*120,g:60,life:0,max:3,r:5+Math.random()*4,c:NMFX_COL[(Math.random()*NMFX_COL.length)|0],k:"paper",rot:Math.random()*7,vr:(Math.random()-.5)*10}); }
  // gentle drifting embers in the background so every stall feels alive
  if(Math.random()<.25) L.fx.push({x:Math.random()*W,y:H+5,vx:(Math.random()-.5)*20,vy:-40-Math.random()*40,g:0,life:0,max:5,r:1.5+Math.random()*2,c:"rgba(255,200,120,.6)",k:"ember",rot:0,vr:0});
  x.save(); x.globalCompositeOperation="lighter";
  for(let i=L.fx.length-1;i>=0;i--){ const p=L.fx[i]; p.life+=dt; if(p.life>p.max){ L.fx.splice(i,1); continue; } p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt; const k=1-p.life/p.max;
    if(p.k==="paper"){ x.globalCompositeOperation="source-over"; x.save(); x.translate(p.x,p.y); x.rotate(p.rot); x.scale(1,Math.abs(Math.cos(p.rot*1.7))); x.fillStyle=p.c; x.globalAlpha=Math.min(1,k*2); x.fillRect(-p.r,-p.r*.5,p.r*2,p.r); x.restore(); x.globalCompositeOperation="lighter"; continue; }
    if(p.k==="coin"){ x.globalCompositeOperation="source-over"; nmDraw(x,"fish-coin",p.x,p.y,p.r*4,0,Math.min(1,k*2)); x.globalCompositeOperation="lighter"; continue; }
    if(p.k==="drop"){ x.fillStyle=`rgba(190,235,255,${k})`; x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill(); continue; }
    x.globalAlpha=k; x.fillStyle=p.c; x.beginPath(); if(p.k==="star"){ for(let j=0;j<8;j++){ const rr=j%2?p.r*.4:p.r*1.6, a=p.rot+j*Math.PI/4; x.lineTo(p.x+Math.cos(a)*rr,p.y+Math.sin(a)*rr); } } else x.arc(p.x,p.y,p.r*(p.k==="ember"?1:k+.3),0,7); x.fill(); }
  x.restore(); x.globalAlpha=1; }

/* ===== 1. 地瓜球: call and response. The boss presses a pattern on the beat, you press the same pattern in the next bar ===== */
function playQQ(){ const L=gameLayer("地瓜球","老闆壓一次，你照著節奏壓一次"); const {x,cv}=L; const BPM=104, B=60/BPM;
  nmPreload(["qq-pan","qq-y","qq-p","qq-c","qq-spatula","qq-basket"]);
  // a bigger pool of one-bar patterns, from easy to tricky; each game picks 8 of them, getting harder as it goes
  const EASY=[[0,1,2,3],[0,1,2],[0,2],[0,2,3],[1,2,3],[0,1,3],[0,3]],
        MID=[[0,2,2.5],[0,.5,1,2],[0,1,1.5,3],[0,1,2,2.5],[.5,1.5,2.5],[0,1.5,2],[0,.5,2,2.5],[0,1,2.5,3]],
        HARD=[[0,.5,1,1.5,2],[0,1.5,2,3,3.5],[0,.75,1.5,2.5,3],[0,.5,1.5,2,3],[.5,1,2,2.5,3.5],[0,.25,.5,2,3],[0,1,1.25,1.5,3],[0,.75,1.5,2.25,3]];
  const pk=(a,n)=>a.slice().sort(()=>Math.random()-.5).slice(0,n);
  const ROUNDS=[...pk(EASY,3),...pk(MID,3),...pk(HARD,2)];
  const a=ensureAudio(); let t0=null, started=false, notes=[], good=0, perfect=0, combo=0, puff=0, fb=null;
  const PER=3; // each round: the boss's bar, your bar, then a bar to breathe
  ROUNDS.forEach((pat,r)=>{ const bar=1+r*PER; pat.forEach(o=>{ notes.push({who:"boss",t:(bar*4+o)*B}); notes.push({who:"me",t:((bar+1)*4+o)*B,done:false}); }); });
  const total=notes.filter(n=>n.who==="me").length, END=(1+ROUNDS.length*PER-1)*4*B+1;
  bgmHush=true; { const c0=L.close; L.close=()=>{ bgmHush=false; c0(); }; }
  const click=(t,f,v)=>{ if(!a) return; const o=a.createOscillator(), g=a.createGain(); o.type="square"; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v*sVol(),t+.005); g.gain.exponentialRampToValueAtTime(.0001,t+.08); o.connect(g).connect(sfxBus(a)); o.start(t); o.stop(t+.1); };
  const squish=t=>{ if(!a) return; const o=a.createOscillator(), g=a.createGain(); o.type="sine"; o.frequency.setValueAtTime(420,t); o.frequency.exponentialRampToValueAtTime(140,t+.12); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.22*sVol(),t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+.18); o.connect(g).connect(sfxBus(a)); o.start(t); o.stop(t+.2); };
  const start=()=>{ if(started) return; started=true; t0=(a?a.currentTime:performance.now()/1000)+.6; for(let b=0;b<END/B;b++) click(t0+b*B,b%4===0?1320:880,b%4===0?.07:.04); notes.forEach(n=>{ if(n.who==="boss") squish(t0+n.t); }); };
  const now=()=>(a?a.currentTime:performance.now()/1000)-t0;
  const press=()=>{ if(L.endMsg){ L.close(); return; } if(!started){ start(); return; } const tn=now(); let best=null, bd=1e9;
    for(const n of notes) if(n.who==="me"&&!n.done){ const d=Math.abs(n.t-tn); if(d<bd){ bd=d; best=n; } }
    if(a) squish(a.currentTime); puff=1;
    if(best&&bd<.16){ fxBurst(L,L.W()/2,L.H()*.55,bd<.07?22:10,{kind:bd<.07?"star":"spark",cols:["#ffe14d","#ffb347","#c58bff","#fff4c8"]}); best.done=true; good++; combo++; if(bd<.07){ perfect++; fb={t:"讚！",c:"#ffe14d",at:performance.now(),perfect:true}; } else fb={t:"還行",c:"#fff",at:performance.now()}; }
    else { combo=0; fb={t:"壓太早/太晚",c:"#ffb3a0",at:performance.now()}; } };
  cv.addEventListener("pointerdown",e=>{ e.preventDefault(); press(); });
  const balls=[...Array(10)].map((_,i)=>({k:["qq-y","qq-p","qq-c"][i%3],x:Math.random()*.7-.35,y:Math.random()*.3-.15,s:.55+Math.random()*.25}));
  const draw=()=>{ if(L.done) return; const W=L.W(), H=L.H(); nmBg(x,W,H,"#2a0f08","#120604");
    const cx=W/2, cy=H*.6, PW=Math.min(W*.95,440), tn=started?now():-1;
    nmDraw(x,"qq-pan",cx,cy,PW);
    let bossHit=0; for(const n of notes) if(n.who==="boss"&&tn>=n.t&&tn-n.t<.15) bossHit=1-(tn-n.t)/.15;
    for(const n of notes) if(n.who==="me"&&!n.done&&tn-n.t>.16){ n.done=true; combo=0; fb={t:"沒壓到",c:"#ffb3a0",at:performance.now()}; }
    puff*=.86; const grow=.6+1.25*Math.min(1,good/total), sq=Math.max(bossHit,puff);
    balls.forEach(b=>nmDraw(x,b.k,cx+b.x*PW*.62,cy-PW*.04+b.y*PW*.22,PW*.11*b.s));
    // the big ball everyone is pressing: squashes on each press and gets fluffier as you hit the beats
    x.save(); x.translate(cx,cy-PW*.08); x.scale(1+sq*.35,1-sq*.35); nmDraw(x,"qq-y",0,0,PW*.26*grow); x.restore();
    const sp=(px,down,flip)=>nmDraw(x,"qq-spatula",px,cy-PW*.32+down*PW*.12,PW*.34,flip?-.5:.5,1,flip);
    sp(cx-PW*.3,bossHit,true); sp(cx+PW*.3,puff,false);
    nmText(x,"老闆",cx-PW*.32,cy+PW*.36,18,"#f0e0c0"); nmText(x,"你",cx+PW*.32,cy+PW*.36,18,"#f0e0c0");
    if(started&&tn<END){ const bar=Math.floor(tn/(4*B)), inBar=(tn/B)%4, ph=bar<1?-1:(bar-1)%PER, mine=ph===1;
      nmText(x,ph<0?"預備…":ph===1?"換你壓！":ph===2?"休息一下…":"看老闆壓",W/2,150,26,mine?"#7dffb0":ph===2?"#c8b8a0":"#ffe2a0");
      for(let i=0;i<4;i++){ const on=Math.floor(inBar)===i; nmDraw(x,i%2?"qq-p":"qq-y",W/2+(i-1.5)*34,182,on?26:18,0,on?1:.45); } }
    if(!started){ nmText(x,"點畫面開始",W/2,H*.27,30); nmText(x,"老闆壓一小節，你照同樣節奏壓下一小節",W/2,H*.27+36,16,"#fff",undefined,500); }

function sbScore(d){ const c={}; d.forEach(v=>c[v]=(c[v]||0)+1); const vals=Object.keys(c).map(Number);

  const pairs=vals.filter(v=>c[v]>=2); if(!pairs.length) return null;
  if(vals.length===2&&c[vals[0]]===2){ const hi=Math.max(...vals); return {s:hi*2,t:`${hi*2} 點`}; }
  if(vals.length===2) return null;
  const p=pairs[0], rest=d.filter(v=>v!==p); const s=rest.reduce((a,b)=>a+b,0); return {s,t:s===12?"十八啦！":s===3?"逼機（3 點）":`${s} 點`}; }
